<script>

const SUPABASE_URL =
  "https://zhhgiwqehwuwzxnqbnth.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_sPMtACRDzijX9yeeQ_wUUw_QGuOeryJ";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================
   URL
========================= */

const params =
  new URLSearchParams(
    window.location.search
  );

const hostId =
  params.get("host") || params.get("id") || params.get("user");


/* =========================
   VARIABLES
========================= */

let chatDisposed=false,chatAuthSubscription=null,chatUI=null;
let photoSelection=null,photoAttempt=null;
window.mimoMediaResolver=window.MimoMedia?.resolver(supabaseClient,()=>!chatDisposed&&!!currentUser);
let currentUser = null;
let hostProfile = null;
let conversationId = null;
let realtimeChannel = null;
let messageSending = false;
let readTracker = null;
let receiptPoll = null;
let receiptRefreshing = false;


/* =========================
   INIT
========================= */

async function toggleChatBlock() {
  if(!currentUser||!hostProfile)return;
  const button=document.getElementById("blockContact");button.disabled=true;
  try {
    const blocked=await MimoContacts.isBlocked(supabaseClient,currentUser.id,hostId);
    await MimoContacts.setBlocked(supabaseClient,currentUser.id,hostId,!blocked);
    button.textContent=blocked?"Block":"Unblock";
    alert(blocked?"Contact unblocked.":"Contact blocked. New messages, follows and calls are unavailable.");
  }catch(error){alert("Unable to change blocking settings. Please try again.");}
  finally{button.disabled=chatDisposed;if(!chatDisposed){try{const permissions=await MimoContacts.permissions(supabaseClient,hostId);if(!chatDisposed)for(const id of ['voiceCall','videoCall'])document.getElementById(id).disabled=permissions.call!==true;}catch{}}}
}

async function init() {

  if (!hostId) {

    showError(
      "Choose a person from the home page to open a chat."
    );
    document.getElementById("hostName").textContent = "Choose a contact";

    return;
  }


  const {
    data: {
      user
    },
    error
  } =
    await supabaseClient.auth.getUser();


  if (error) {

    console.error(
      "Auth error:",
      error
    );

    showError(
      "Unable to check login."
    );

    return;
  }


  if(chatDisposed)return;
  currentUser = user;


  if (!currentUser) {

    showLoginMessage();

    return;
  }


  if(chatDisposed)return;
  await loadHost();


  if (!hostProfile) {

    return;
  }


  const blockButton=document.getElementById("blockContact");
  try{blockButton.textContent=await MimoContacts.isBlocked(supabaseClient,currentUser.id,hostId)?"Unblock":"Block";blockButton.disabled=false;}catch(error){console.warn(error);}
  configureChatUI();
  if(chatDisposed)return;
  await loadConversation();

}


/* =========================
   LOAD HOST
========================= */

async function loadHost() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("profiles")
      .select(`
        id,
        username,
        display_name,
        avatar_url,
        online_status,
        role
      `)
      .eq(
        "id",
        hostId
      )
      .maybeSingle();


  if (error) {

    console.error(
      "Host error:",
      error
    );

    showError(
      "Unable to load host."
    );

    return;
  }


  if (!data) {

    showError(
      "Host not found."
    );

    return;
  }


  if(chatDisposed)return;
  hostProfile =
    data;


  document.getElementById(
    "hostName"
  ).textContent =
    data.display_name ||
    data.username ||
    "Host";


  document.getElementById('hostInitial').textContent=(data.display_name||data.username||'M').slice(0,1);
  const avatar=document.getElementById('hostAvatar');let avatarURL=null;try{const u=new URL(data.avatar_url);if(u.protocol==='https:'&&!u.username&&!u.password)avatarURL=u.href;}catch{}if(avatarURL){avatar.src=avatarURL;avatar.hidden=false;avatar.onerror=()=>{avatar.hidden=true;};}else{avatar.removeAttribute('src');avatar.hidden=true;}
  document.getElementById('chatProfile').href='profile.html?id='+encodeURIComponent(hostId);
  document.getElementById(
    "hostStatus"
  ).textContent =
    data.online_status === "online"
      ? "🟢 Online"
      : "Offline";

}


/* =========================
   FIND CONVERSATION
========================= */

async function loadConversation() {

  /*
    First direction:
    current user -> host
  */

  const first =
    await supabaseClient
      .from("conversations")
      .select("id")
      .eq(
        "user_one_id",
        currentUser.id
      )
      .eq(
        "user_two_id",
        hostId
      )
      .limit(1);


  if (first.error) {

    console.error(
      "Conversation query 1 error:",
      first.error
    );

    showError(
      "Unable to load conversations."
    );

    return;
  }


  if (
    first.data &&
    first.data.length > 0
  ) {

    conversationId =
      first.data[0].id;

  }


  /*
    Second direction:
    host -> current user
  */

  if (!conversationId) {

    const second =
      await supabaseClient
        .from("conversations")
        .select("id")
        .eq(
          "user_one_id",
          hostId
        )
        .eq(
          "user_two_id",
          currentUser.id
        )
        .limit(1);


    if (second.error) {

      console.error(
        "Conversation query 2 error:",
        second.error
      );

      showError(
        "Unable to load conversations."
      );

      return;
    }


    if (
      second.data &&
      second.data.length > 0
    ) {

      conversationId =
        second.data[0].id;

    }

  }


  /*
    No conversation found:
    create one.
  */

  if (!conversationId) {

    await createConversation();

  }


  if (!conversationId) {

    return;
  }


  // Conversations themselves identify the two participants; no client membership writes.


  if (!conversationId) {

    return;
  }


  readTracker=MimoMessages.readTracker({client:supabaseClient,userId:currentUser.id,conversationId,
    visible:()=>document.visibilityState!=='hidden',
    onError:()=>{document.getElementById('readStatus').textContent='Read status unavailable. Retrying…';},
    onSuccess:()=>{document.getElementById('readStatus').textContent='';}});
  await loadMessages();


  subscribeToMessages();
  receiptPoll=setInterval(refreshReceipts,15000);

}


/* =========================
   CREATE CONVERSATION
========================= */

async function createConversation() {
  if(!await MimoContacts.allow(supabaseClient,hostId,"start_chat"))return;

  const {
    data,
    error
  } =
    await supabaseClient
      .from("conversations")
      .insert({
        user_one_id:
          currentUser.id,

        user_two_id:
          hostId
      })
      .select("id")
      .single();


  if (error) {

    console.error(
      "Create conversation error:",
      error
    );

    showError(
      "Unable to create conversation."
    );

    return;
  }


  conversationId =
    data.id;

}


/* =========================
   ENSURE MEMBERS
========================= */

async function ensureMembers() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("conversation_members")
      .select("user_id")
      .eq(
        "conversation_id",
        conversationId
      );


  if (error) {

    console.error(
      "Members error:",
      error
    );

    showError(
      "Unable to load chat members."
    );

    return;
  }


  const existingIds =
    (data || []).map(
      item =>
        item.user_id
    );


  const missingMembers =
    [];


  if (
    !existingIds.includes(
      currentUser.id
    )
  ) {

    missingMembers.push({
      conversation_id:
        conversationId,

      user_id:
        currentUser.id
    });

  }


  if (
    !existingIds.includes(
      hostId
    )
  ) {

    missingMembers.push({
      conversation_id:
        conversationId,

      user_id:
        hostId
    });

  }


  if (
    missingMembers.length === 0
  ) {

    return;
  }


  const {
    error: insertError
  } =
    await supabaseClient
      .from("conversation_members")
      .insert(
        missingMembers
      );


  if (insertError) {

    console.error(
      "Insert members error:",
      insertError
    );

    showError(
      "Unable to create chat members."
    );

    return;
  }

}


/* =========================
   LOAD MESSAGES
========================= */

async function loadMessages() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("messages")
      .select(`
        id,
        conversation_id,
        sender_id,
        content,
        message_type,
        image_url,
        is_read,
        created_at
      `)
      .eq(
        "conversation_id",
        conversationId
      )
      .order(
        "created_at",
        {
          ascending: true
        }
      );


  if (error) {

    console.error(
      "Messages error:",
      error
    );

    showError(
      "Unable to load messages."
    );

    return;
  }


  if(chatDisposed)return;
  renderMessages(
    data || []
  );
  if(readTracker)readTracker.queue(data||[]);

}


/* =========================
   RENDER MESSAGES
========================= */

function renderMessages(
  messages
) {

  const area =
    document.getElementById(
      "chatArea"
    );


  area.innerHTML = "";


  if (
    !messages ||
    messages.length === 0
  ) {

    area.innerHTML = `
      <div class="empty">
        Start a conversation with
        ${escapeHtml(
          hostProfile.display_name ||
          hostProfile.username ||
          "this host"
        )}
        ❤️
      </div>
    `;

    return;
  }


  messages.forEach(
    message => {

      addMessageToScreen(
        message
      );

    }
  );


  scrollToBottom();

}


/* =========================
   ADD MESSAGE
========================= */

function addMessageToScreen(
  message
) {

  if(chatDisposed||!currentUser||document.getElementById('message-'+message.id))return;
  const UI=window.MimoMessagingUI,date=new Date(message.created_at);if(UI&&Number.isFinite(date.getTime())){const last=document.querySelector('.message-row:last-of-type');if(!last||last.dataset.day!==date.toLocaleDateString()){const heading=document.createElement('div');heading.className='chat-day';heading.textContent=date.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});document.getElementById('chatArea').append(heading);}}

  const area =
    document.getElementById(
      "chatArea"
    );


  const isMe =
    message.sender_id ===
    currentUser.id;


  const row =
    document.createElement(
      "div"
    );


  row.className =
    "message-row " +
    (
      isMe
        ? "me"
        : "host"
    );
  row.id='message-'+message.id;
  row.dataset.sender=message.sender_id;


  const bubble =UI?UI.bubble(document,message):document.createElement("div");


  bubble.className =
    "message " +
    (
      isMe
        ? "me"
        : "host"
    );


  if(!UI)bubble.textContent=message.content;
  if(UI&&Number.isFinite(date.getTime())){row.dataset.day=date.toLocaleDateString();const time=document.createElement('time');time.className='message-time';time.textContent=date.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});time.dateTime=date.toISOString();bubble.append(time);}if(UI&&!isMe){const avatar=document.getElementById('hostAvatar');if(!avatar.hidden&&avatar.src){const img=document.createElement('img');img.className='mini-avatar';img.src=avatar.src;img.alt='';img.onerror=()=>img.remove();row.append(img);}else{const initial=document.createElement('span');initial.className='mini-avatar';initial.textContent=(hostProfile?.display_name||hostProfile?.username||'M').slice(0,1);row.append(initial);}}


  row.appendChild(
    bubble
  );
  if(isMe){const receipt=document.createElement('span');receipt.className='receipt';receipt.textContent=message.is_read?'Seen':'Sent';row.appendChild(receipt);}


  area.appendChild(
    row
  );

}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage() {
  if(chatDisposed||messageSending)return;messageSending=true;
  try {

  if (!currentUser) {

    showLoginMessage();

    return;
  }


  if (!conversationId) {

    alert(
      "Conversation is not ready yet."
    );

    return;
  }


  const input =
    document.getElementById(
      "messageInput"
    );


  const content =
    input.value.trim();


  if (!content) {

    return;
  }


  const button =
    document.getElementById(
      "sendButton"
    );


  button.disabled =
    true;


  if(!await MimoContacts.allow(supabaseClient,hostId,"message"))return;

  const {
    data,
    error
  } =
    await supabaseClient
      .from("messages")
      .insert({
        conversation_id:
          conversationId,

        sender_id:
          currentUser.id,

        content:
          content
      })
      .select(`
        id,
        conversation_id,
        sender_id,
        content,
        message_type,
        image_url,
        is_read,
        created_at
      `)
      .single();


  button.disabled =
    false;


  if (error) {

    console.error(
      "Send message error:",
      error
    );

    alert(
      "Message could not be sent."
    );

    return;
  }


  if(chatDisposed)return;
  input.value = "";


  const empty =
    document
      .getElementById(
        "chatArea"
      )
      .querySelector(
        ".empty"
      );


  if (empty) {

    empty.remove();

  }


  /*
    Show our message immediately.
  */

  addMessageToScreen(
    data
  );


  scrollToBottom();

  } catch(error){console.warn("Message send failed",error);alert("Message could not be sent. Please try again.");}
  finally {messageSending=false;document.getElementById("sendButton").disabled=chatDisposed;}
}


/* =========================
   REALTIME
========================= */

function subscribeToMessages() {

  if (realtimeChannel) {

    supabaseClient.removeChannel(
      realtimeChannel
    );

  }


  realtimeChannel =
    supabaseClient
      .channel(
        "messages-" +
        conversationId
      )
      .on(
        "postgres_changes",
        {
          event: "INSERT",
          schema: "public",
          table: "messages",
          filter:
            "conversation_id=eq." +
            conversationId
        },
        payload => {

          /*
            Do not duplicate
            our own message.
          */

          if (
            !chatDisposed&&currentUser&&payload.new.sender_id !==
            currentUser.id
          ) {

            addMessageToScreen(
              payload.new
            );

            scrollToBottom();
            if(readTracker)readTracker.queue([payload.new]);

          }

        }
      )
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'messages',filter:'conversation_id=eq.'+conversationId},payload=>{
        updateReceipt(payload.new);
      })
      .subscribe();

}

function updateReceipt(message){
  if(!message.is_read||message.sender_id!==currentUser?.id)return;
  const receipt=document.getElementById('message-'+message.id)?.querySelector('.receipt');
  if(receipt)receipt.textContent='Seen';
}
async function refreshReceipts(){
  if(document.visibilityState==='hidden'||!currentUser||!conversationId||receiptRefreshing)return;
  receiptRefreshing=true;
  try{
    if(readTracker)await readTracker.flush();
    const ids=Array.from(document.querySelectorAll('.message-row')).filter(row=>row.dataset.sender===currentUser.id&&row.querySelector('.receipt')?.textContent==='Sent').map(row=>row.id.slice(8));
    for(let i=0;i<ids.length;i+=200){
      const {data,error}=await supabaseClient.from('messages').select('id,sender_id,is_read').eq('conversation_id',conversationId).eq('sender_id',currentUser.id).in('id',ids.slice(i,i+200));
      if(error)throw error;
      (data||[]).forEach(updateReceipt);
    }
  }catch(error){console.warn('Receipt refresh failed',error);}
  finally{receiptRefreshing=false;}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='hidden')refreshReceipts();});
window.addEventListener('pagehide',disposeChat);
window.addEventListener('pageshow',event=>{if(event.persisted)location.reload();});


/* =========================
   ENTER KEY
========================= */

document
  .getElementById(
    "messageInput"
  )
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key ===
        "Enter"
      ) {

        event.preventDefault();

        sendMessage();

      }

    }
  );


/* =========================
   HELPERS
========================= */

function scrollToBottom() {

  const area =
    document.getElementById(
      "chatArea"
    );


  area.scrollTop =
    area.scrollHeight;

}


function escapeHtml(
  text
) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    text;


  return div.innerHTML;

}


function showError(
  message
) {

  document.getElementById(
    "chatArea"
  ).innerHTML = `
    <div class="empty">
      ${escapeHtml(message)}
    </div>
  `;

}


function showLoginMessage() {

  document.getElementById(
    "chatArea"
  ).innerHTML = `
    <div class="empty">
      Please login first
      to start chatting.
    </div>
  `;

}


function goBack() {

  location.href="messages.html";

}


function setupPhotoUploads(){if(!window.MimoMedia||photoSelection)return;const el=id=>document.getElementById(id);photoSelection=MimoMedia.selection(el('chatPhotoFile'),el('chatPhotoPreview'),{max:1,canChange:()=>!chatDisposed&&!messageSending,onChange:error=>{photoAttempt=null;el('photoDraft').hidden=!photoSelection.files().length;el('photoStatus').textContent=error?.message||'Photo ready. Tap Send photo to send.';if(error)alert(error.message);el('sendPhoto').disabled=!photoSelection.files().length;}});el('cancelPhoto').onclick=()=>{if(messageSending)return;photoSelection.clear();photoAttempt=null;el('photoDraft').hidden=true;};el('sendPhoto').onclick=sendPhotoMessage;}
async function sendPhotoMessage(){if(chatDisposed||messageSending||!currentUser||!conversationId||!photoSelection?.files().length)return;messageSending=true;const el=id=>document.getElementById(id),actor=currentUser.id,chat=conversationId;for(const id of ['sendPhoto','cancelPhoto','sendButton'])el(id).disabled=true;photoAttempt=photoAttempt||MimoMedia.attempt();const state=photoAttempt;try{if(!await MimoContacts.allow(supabaseClient,hostId,'message'))throw Error('Sending is unavailable for this contact.');if(chatDisposed)return;el('photoStatus').textContent='Preparing photo…';const path=actor+'/chats/'+chat+'/'+state.id+'.jpg';await MimoMedia.upload(supabaseClient,state,path,photoSelection.files()[0],false,()=>!chatDisposed&&currentUser?.id===actor,text=>el('photoStatus').textContent=text);if(chatDisposed)return;el('photoStatus').textContent='Sending…';const {data,error}=await supabaseClient.rpc('mimo_send_image',{request_id:state.id,target_chat:chat,media_path:path});if(error)throw error;if(chatDisposed)return;if(!Array.isArray(data)||data.length!==1)throw Error('Send could not be confirmed.');addMessageToScreen(data[0]);scrollToBottom();photoSelection.clear();photoAttempt=null;el('photoDraft').hidden=true;}catch(error){if(!chatDisposed)el('photoStatus').textContent=(error.message||'Send failed.')+' Your photo is retained. Tap Send photo to retry.';}finally{messageSending=false;for(const id of ['sendPhoto','cancelPhoto','sendButton'])el(id).disabled=chatDisposed;}}

async function configureChatUI(){if(!window.MimoMessagingUI||!currentUser||chatDisposed)return;setupPhotoUploads();chatUI=MimoMessagingUI.setupChat({d:document,getUser:()=>currentUser,canUse:()=>!chatDisposed&&!!currentUser&&!!hostProfile&&!messageSending,getContact:()=>hostProfile,onBlock:toggleChatBlock,onPhoto:()=>{if(conversationId)document.getElementById('chatPhotoFile').click();else alert('Conversation is not ready yet.');},onCall:async type=>{if(chatDisposed||!currentUser)return;if(!await MimoContacts.allow(supabaseClient,hostId,'call'))return;if(!chatDisposed)location.href='call.html?user='+encodeURIComponent(hostId)+(type==='video'?'&type=video':'');}});for(const id of ['chatMore','emojiButton','chatPlus'])document.getElementById(id).disabled=false;try{const permissions=await MimoContacts.permissions(supabaseClient,hostId);if(chatDisposed)return;for(const id of ['voiceCall','videoCall']){document.getElementById(id).disabled=permissions.call!==true;document.getElementById(id).title=permissions.call?'Start call':'Calls are available from User to Host only, subject to blocking';}}catch{} }
function disposeChat(){chatDisposed=true;window.mimoMediaResolver?.dispose();photoSelection?.dispose();photoAttempt=null;document.getElementById('photoDraft').hidden=true;clearInterval(receiptPoll);readTracker?.dispose();if(realtimeChannel)supabaseClient.removeChannel(realtimeChannel);chatAuthSubscription?.unsubscribe();chatUI?.dispose();document.getElementById('messageInput').value='';document.getElementById('chatArea').replaceChildren();document.getElementById('hostName').textContent='Chat';document.getElementById('hostStatus').textContent='';document.getElementById('readStatus').textContent='';document.getElementById('hostAvatar').hidden=true;document.getElementById('hostAvatar').removeAttribute('src');document.getElementById('hostInitial').textContent='M';document.getElementById('chatProfile').removeAttribute('href');for(const id of ['voiceCall','videoCall','chatMore','emojiButton','chatPlus','sendButton','blockContact'])document.getElementById(id).disabled=true;currentUser=null;hostProfile=null;}
window.MimoMessagingUI?.hydrate(document);
if(supabaseClient.auth?.onAuthStateChange)chatAuthSubscription=supabaseClient.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'||(currentUser&&session&&session.user.id!==currentUser.id)){disposeChat();showError('Your session changed. Reload or sign in again.');}}).data.subscription;
/* =========================
   START
========================= */

init();

</script>
