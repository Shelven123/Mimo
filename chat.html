```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mimo Chat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f7f7f9;
  color: #222;
}

.header {
  height: 64px;
  background: white;
  display: flex;
  align-items: center;
  padding: 0 16px;
  border-bottom: 1px solid #eee;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 10;
}

.back {
  border: none;
  background: none;
  font-size: 25px;
  cursor: pointer;
  margin-right: 12px;
}

.host-info {
  display: flex;
  align-items: center;
  gap: 10px;
}

.host-avatar {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  object-fit: cover;
}

.host-name {
  font-size: 16px;
  font-weight: bold;
}

.host-status {
  font-size: 12px;
  color: #999;
  margin-top: 3px;
}

.chat-area {
  position: fixed;
  top: 64px;
  bottom: 76px;
  left: 0;
  right: 0;
  overflow-y: auto;
  padding: 18px 14px;
}

.message-row {
  display: flex;
  margin-bottom: 12px;
}

.message-row.me {
  justify-content: flex-end;
}

.message-row.host {
  justify-content: flex-start;
}

.message {
  max-width: 75%;
  padding: 11px 14px;
  border-radius: 18px;
  font-size: 15px;
  line-height: 1.4;
  word-break: break-word;
}

.message.me {
  background: #ff4f81;
  color: white;
  border-bottom-right-radius: 5px;
}

.message.host {
  background: white;
  color: #222;
  border-bottom-left-radius: 5px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}

.empty {
  text-align: center;
  color: #aaa;
  margin-top: 35vh;
  font-size: 14px;
}

.input-area {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  height: 76px;
  background: white;
  border-top: 1px solid #eee;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px;
}

.input-area input {
  flex: 1;
  height: 46px;
  border: 1px solid #ddd;
  border-radius: 23px;
  padding: 0 16px;
  font-size: 15px;
  outline: none;
}

.input-area input:focus {
  border-color: #ff4f81;
}

.send-btn {
  width: 46px;
  height: 46px;
  border: none;
  border-radius: 50%;
  background: #ff4f81;
  color: white;
  font-size: 20px;
  cursor: pointer;
}

.send-btn:disabled {
  opacity: 0.5;
  cursor: default;
}
</style>
</head>

<body>

<div class="header">

  <button class="back" onclick="goBack()">‹</button>

  <div class="host-info">
    <img id="hostAvatar" class="host-avatar" src="https://i.pravatar.cc/200?img=47">

    <div>
      <div id="hostName" class="host-name">Loading...</div>
      <div id="hostStatus" class="host-status">Offline</div>
    </div>
  </div>

</div>

<div id="chatArea" class="chat-area">
  <div id="emptyMessage" class="empty">
    Loading conversation...
  </div>
</div>

<div class="input-area">

  <input
    id="messageInput"
    type="text"
    placeholder="Type a message..."
    maxlength="1000"
    autocomplete="off"
  >

  <button
    id="sendButton"
    class="send-btn"
    onclick="sendMessage()"
  >
    ➤
  </button>

</div>

<script>

const SUPABASE_URL =
  "https://zhhgiwqehwuwzxnqbnth.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_sPMtACRDzijX9yeeQ_wUUw_QGuOeryJ";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================
   URL
========================= */

const params =
  new URLSearchParams(window.location.search);

const hostId =
  params.get("host");


/* =========================
   VARIABLES
========================= */

let currentUser = null;
let hostProfile = null;
let conversationId = null;


/* =========================
   INIT
========================= */

async function init() {

  if (!hostId) {

    showError("Host not found.");

    return;
  }

  /*
    Check logged-in user
  */

  const {
    data: { user }
  } = await supabaseClient.auth.getUser();

  currentUser = user;

  /*
    Load Host
  */

  await loadHost();

  /*
    If user is logged in,
    create / find conversation
  */

  if (currentUser) {

    await loadConversation();

  } else {

    showLoginMessage();

  }

}


/* =========================
   LOAD HOST
========================= */

async function loadHost() {

  const {
    data,
    error
  } = await supabaseClient
    .from("profiles")
    .select(`
      id,
      username,
      display_name,
      avatar_url,
      online_status,
      role
    `)
    .eq("id", hostId)
    .eq("role", "host")
    .maybeSingle();


  if (error) {

    console.error(error);

    showError("Unable to load host.");

    return;
  }


  if (!data) {

    showError("Host not found.");

    return;
  }


  hostProfile = data;


  document.getElementById("hostName").textContent =
    data.display_name || data.username || "Host";


  document.getElementById("hostAvatar").src =
    data.avatar_url ||
    "https://i.pravatar.cc/200?img=47";


  document.getElementById("hostStatus").textContent =
    data.online_status === "online"
      ? "🟢 Online"
      : "Offline";

}


/* =========================
   FIND / CREATE CONVERSATION
========================= */

async function loadConversation() {

  /*
    Find conversations where
    current user is a member
  */

  const {
    data: myMemberships,
    error: memberError
  } = await supabaseClient
    .from("conversation_members")
    .select("conversation_id")
    .eq("user_id", currentUser.id);


  if (memberError) {

    console.error(memberError);

    showError("Unable to load conversations.");

    return;
  }


  /*
    Check if one of those conversations
    also contains the Host.
  */

  if (myMemberships && myMemberships.length > 0) {

    for (const membership of myMemberships) {

      const {
        data: hostMember,
        error
      } = await supabaseClient
        .from("conversation_members")
        .select("conversation_id")
        .eq(
          "conversation_id",
          membership.conversation_id
        )
        .eq(
          "user_id",
          hostId
        )
        .maybeSingle();


      if (!error && hostMember) {

        conversationId =
          membership.conversation_id;

        break;
      }

    }

  }


  /*
    If conversation doesn't exist,
    create it.
  */

  if (!conversationId) {

    await createConversation();

  }


  /*
    Load messages
  */

  if (conversationId) {

    await loadMessages();

    subscribeToMessages();

  }

}


/* =========================
   CREATE CONVERSATION
========================= */

async function createConversation() {

  /*
    Create conversation
  */

  const {
    data: conversation,
    error: conversationError
  } = await supabaseClient
    .from("conversations")
    .insert({})
    .select("id")
    .single();


  if (conversationError) {

    console.error(conversationError);

    showError(
      "Unable to create conversation. Please check your login."
    );

    return;
  }


  conversationId =
    conversation.id;


  /*
    Add current user
  */

  const {
    error: memberError
  } = await supabaseClient
    .from("conversation_members")
    .insert([
      {
        conversation_id: conversationId,
        user_id: currentUser.id
      },
      {
        conversation_id: conversationId,
        user_id: hostId
      }
    ]);


  if (memberError) {

    console.error(memberError);

    showError(
      "Unable to create conversation members."
    );

    return;
  }

}


/* =========================
   LOAD MESSAGES
========================= */

async function loadMessages() {

  const {
    data,
    error
  } = await supabaseClient
    .from("messages")
    .select(`
      id,
      conversation_id,
      sender_id,
      content,
      created_at
    `)
    .eq(
      "conversation_id",
      conversationId
    )
    .order(
      "created_at",
      {
        ascending: true
      }
    );


  if (error) {

    console.error(error);

    showError("Unable to load messages.");

    return;
  }


  renderMessages(data || []);

}


/* =========================
   RENDER MESSAGES
========================= */

function renderMessages(messages) {

  const area =
    document.getElementById("chatArea");

  area.innerHTML = "";


  if (!messages.length) {

    area.innerHTML = `
      <div class="empty">
        Start a conversation with ${escapeHtml(
          hostProfile.display_name || "this host"
        )} ❤️
      </div>
    `;

    return;
  }


  messages.forEach(message => {

    const isMe =
      message.sender_id === currentUser.id;


    const row =
      document.createElement("div");

    row.className =
      "message-row " +
      (isMe ? "me" : "host");


    const bubble =
      document.createElement("div");

    bubble.className =
      "message " +
      (isMe ? "me" : "host");


    bubble.textContent =
      message.content;


    row.appendChild(bubble);

    area.appendChild(row);

  });


  scrollToBottom();

}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage() {

  if (!currentUser) {

    showLoginMessage();

    return;
  }


  if (!conversationId) {

    return;
  }


  const input =
    document.getElementById("messageInput");

  const content =
    input.value.trim();


  if (!content) {

    return;
  }


  const button =
    document.getElementById("sendButton");

  button.disabled = true;


  const {
    data,
    error
  } = await supabaseClient
    .from("messages")
    .insert({
      conversation_id: conversationId,
      sender_id: currentUser.id,
      content: content
    })
    .select(`
      id,
      conversation_id,
      sender_id,
      content,
      created_at
    `)
    .single();


  button.disabled = false;


  if (error) {

    console.error(error);

    alert(
      "Message could not be sent."
    );

    return;
  }


  input.value = "";


  /*
    Add immediately to screen
  */

  const area =
    document.getElementById("chatArea");

  const oldEmpty =
    area.querySelector(".empty");

  if (oldEmpty) {

    oldEmpty.remove();

  }


  addMessageToScreen(data);

  scrollToBottom();

}


/* =========================
   ADD NEW MESSAGE
========================= */

function addMessageToScreen(message) {

  const area =
    document.getElementById("chatArea");


  const isMe =
    message.sender_id === currentUser.id;


  const row =
    document.createElement("div");

  row.className =
    "message-row " +
    (isMe ? "me" : "host");


  const bubble =
    document.createElement("div");

  bubble.className =
    "message " +
    (isMe ? "me" : "host");


  bubble.textContent =
    message.content;


  row.appendChild(bubble);

  area.appendChild(row);

}


/* =========================
   REALTIME
========================= */

function subscribeToMessages() {

  supabaseClient
    .channel(
      "messages-" + conversationId
    )
    .on(
      "postgres_changes",
      {
        event: "INSERT",
        schema: "public",
        table: "messages",
        filter:
          "conversation_id=eq." +
          conversationId
      },
      payload => {

        /*
          Don't duplicate our own message
        */

        if (
          payload.new.sender_id !==
          currentUser.id
        ) {

          addMessageToScreen(
            payload.new
          );

          scrollToBottom();

        }

      }
    )
    .subscribe();

}


/* =========================
   ENTER KEY
========================= */

document
  .getElementById("messageInput")
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter"
      ) {

        event.preventDefault();

        sendMessage();

      }

    }
  );


/* =========================
   HELPERS
========================= */

function scrollToBottom() {

  const area =
    document.getElementById("chatArea");

  area.scrollTop =
    area.scrollHeight;

}


function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent =
    text;

  return div.innerHTML;

}


function showError(message) {

  document.getElementById(
    "chatArea"
  ).innerHTML = `
    <div class="empty">
      ${escapeHtml(message)}
    </div>
  `;

}


function showLoginMessage() {

  document.getElementById(
    "chatArea"
  ).innerHTML = `
    <div class="empty">
      Please login first to start chatting.
    </div>
  `;

}


function goBack() {

  window.history.back();

}


/* =========================
   START
========================= */

init();

</script>

</body>
</html>
```
