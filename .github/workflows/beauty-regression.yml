name: Beauty regression
on:
  push:
    branches: [main]
    paths: ['call.html', 'call-settings.html', 'call-preferences.js', 'chat.html', 'messages.html', 'message-center.js', 'index.html', 'profile.html', 'blocked-users.html', 'contact-permissions.js', 'supabase/**', 'beauty-*', 'tests/**', 'package*.json', '.github/workflows/beauty-regression.yml']
  pull_request:
    paths: ['call.html', 'call-settings.html', 'call-preferences.js', 'chat.html', 'messages.html', 'message-center.js', 'index.html', 'profile.html', 'blocked-users.html', 'contact-permissions.js', 'supabase/**', 'beauty-*', 'tests/**', 'package*.json', '.github/workflows/beauty-regression.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
