name: Beauty regression
on:
  push:
    branches: [main]
    paths: ['uploads.html', 'upload-manager.js', 'reel-playback.js', 'reel-picker.js', 'media-uploads.js', 'plaza.html', 'plaza.js', 'plaza-social.js', 'plaza-social-ui.js', 'plaza-experience.js', 'plaza-experience.css', 'support.html', 'support-center.js', 'settings.html', 'recharge.html', 'recharge.js', 'wallet.html', 'wallet.js', 'appointments.html', 'appointments.js', 'me.html', 'notifications.html', 'notification-center.js', 'notification-settings.html', 'call.html', 'call-settings.html', 'call-preferences.js', 'chat.html', 'messages.html', 'message-center.js', 'messaging-ui.js', 'messaging.css', 'index.html', 'profile.html', 'blocked-users.html', 'contact-permissions.js', 'supabase/**', 'beauty-*', 'tests/**', 'package*.json', '.github/workflows/beauty-regression.yml']
  pull_request:
    paths: ['uploads.html', 'upload-manager.js', 'reel-playback.js', 'reel-picker.js', 'media-uploads.js', 'plaza.html', 'plaza.js', 'plaza-social.js', 'plaza-social-ui.js', 'plaza-experience.js', 'plaza-experience.css', 'support.html', 'support-center.js', 'settings.html', 'recharge.html', 'recharge.js', 'wallet.html', 'wallet.js', 'appointments.html', 'appointments.js', 'me.html', 'notifications.html', 'notification-center.js', 'notification-settings.html', 'call.html', 'call-settings.html', 'call-preferences.js', 'chat.html', 'messages.html', 'message-center.js', 'messaging-ui.js', 'messaging.css', 'index.html', 'profile.html', 'blocked-users.html', 'contact-permissions.js', 'supabase/**', 'beauty-*', 'tests/**', 'package*.json', '.github/workflows/beauty-regression.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
