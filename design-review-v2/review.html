<!doctype html><html lang="zh-Hans"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mimo · 新版设计预览</title><style>*{box-sizing:border-box}html,body{height:100%;margin:0}body{font:13px system-ui;background:radial-gradient(ellipse at 40% 15%,#594038,#141417 65%);color:#f8e8eb;display:flex;flex-direction:column;align-items:center;padding:10px 0 8px}header{display:flex;align-items:center;gap:12px;margin:0 8px 8px}header small{color:#bba6a7;font-size:10px}nav{display:flex;gap:5px;max-width:100%;overflow:auto;flex-shrink:0;padding:0 8px 10px;scrollbar-width:none}button{font:inherit;white-space:nowrap;cursor:pointer;border:1px solid #8064716b;background:#342a30;color:#d9c9d4;border-radius:16px;padding:6px 10px}button.active{background:#ffb7d8;color:#653a50;border-color:#ffb7d8}iframe{display:block;width:min(100%,393px);flex:1;min-height:0;max-height:780px;border:1px solid #90737c88;border-radius:25px;background:#151417;box-shadow:0 20px 70px #0007}footer{font-size:10px;color:#bca5ae;padding-top:7px;text-align:center}@media(max-width:450px){iframe{border-radius:16px;max-height:none}header{margin-bottom:6px}nav{width:100%}}</style><header><strong>Mimo · 新版设计预览</strong><small>正式网站保持原样</small></header><nav aria-label="预览页面"><button class="active" data-page="home">主页</button><button data-page="host">主播</button><button data-page="plaza">广场</button><button data-page="messages">消息</button><button data-page="chat">聊天</button><button data-page="notifications">通知</button><button data-page="me">我</button><button data-page="settings">设置</button><button data-page="call">通话</button></nav><iframe src="app.html?page=home" title="Mimo 新版主页预览"></iframe><footer>演示资料与互动 · 未连接真实通话、发信或付款</footer><script>for(const b of document.querySelectorAll('nav button'))b.onclick=()=>{for(const x of document.querySelectorAll('nav button'))x.classList.toggle('active',x===b);document.querySelector('iframe').src='app.html?page='+b.dataset.page;document.querySelector('iframe').title='Mimo '+b.textContent+'预览';};</script></html>
