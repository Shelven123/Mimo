<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Mimo — Recharge</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./wallet.js?v=20261010-wallet1"></script><script src="./recharge.js?v=20261010-recharge1"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f7f7f9;color:#222}header{display:flex;align-items:center;gap:16px;padding:18px;background:#fff;position:sticky;top:0;border-bottom:1px solid #eee}h1{font-size:22px;flex:1;margin:0}h2{font-size:18px}h3{font-size:16px}main{max-width:720px;margin:auto;padding:14px 14px calc(35px + env(safe-area-inset-bottom))}.card{padding:16px;background:#fff;border-radius:16px;margin:12px 0}button{font:inherit;border:0;border-radius:18px;padding:12px;background:#fff0f5;color:#b72f53;cursor:pointer}button:disabled{opacity:.5;cursor:default}a{color:#d83e68;text-decoration:none}p{line-height:1.5;overflow-wrap:anywhere}time,.note,#status{font-size:13px;color:#777}#more[hidden]{display:none}</style></head><body>
<header><a href="wallet.html">‹</a><h1>Recharge</h1><button id="refresh">Refresh</button></header><main>
<p class="note">Payment setup is in progress. Purchases are unavailable; no payment or diamond credit happens on this page. Existing recharge records are shown for reference.</p><p id="status" role="status">Loading…</p><h2>Diamond packages</h2><p id="emptyPackages" class="note" hidden>No packages available yet.</p><div id="packages"></div><h2>Your recharge records</h2><p id="emptyOrders" class="note" hidden>No recharge records yet.</p><div id="orders"></div><button id="more" hidden>Load more</button></main>
<script>
const sb=window.supabase.createClient('https://zhhgiwqehwuwzxnqbnth.supabase.co','sb_publishable_sPMtACRDzijX9yeeQ_wUUw_QGuOeryJ'),status=document.getElementById('status'),packages=document.getElementById('packages'),orders=document.getElementById('orders'),refresh=document.getElementById('refresh'),more=document.getElementById('more');
let uid=null,pages=1,busy=false,disposed=false,subscription=null;
async function load(extra=false){if(disposed||busy||!uid)return;busy=true;refresh.disabled=true;more.disabled=true;try{
 const plans=await MimoRecharge.packages(sb);if(disposed)return;const rows=[],seen=new Set(),requested=pages+(extra?1:0);let batch=[];
 for(let page=0;page<requested;page++){batch=await MimoRecharge.history(sb,page*30);if(disposed)return;for(const row of batch)if(!seen.has(row.id)){seen.add(row.id);rows.push(row);}if(batch.length<30)break;}
 const renderedPlans=MimoRecharge.renderPackages(document,plans),renderedOrders=MimoRecharge.renderOrders(document,rows);packages.replaceChildren(renderedPlans);orders.replaceChildren(renderedOrders);pages=requested;more.hidden=batch.length<30;document.getElementById('emptyPackages').hidden=plans.length>0;document.getElementById('emptyOrders').hidden=rows.length>0;status.textContent='';
 }catch(error){if(!disposed)status.textContent='Unable to load recharge information. Tap Refresh to retry.';}finally{busy=false;if(!disposed){refresh.disabled=false;more.disabled=false;}}}
function cleanup(){disposed=true;uid=null;subscription?.unsubscribe();packages.replaceChildren();orders.replaceChildren();more.hidden=true;refresh.disabled=true;}
async function init(){try{subscription=sb.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'||(uid&&session&&session.user.id!==uid)){cleanup();status.textContent='Session changed. Reload or sign in again.';}}).data.subscription;
 const {data,error}=await sb.auth.getUser();if(error)throw error;if(disposed)return;if(!data.user){status.textContent='Sign in to see recharge records. ';const link=document.createElement('a');link.href='login.html';link.textContent='Sign in';status.append(link);refresh.disabled=true;return;}uid=data.user.id;await load();
 }catch(error){if(!disposed){status.textContent='Unable to check login. Reload to retry.';refresh.disabled=true;}}}
refresh.onclick=()=>load();more.onclick=()=>load(true);window.addEventListener('pagehide',cleanup);window.addEventListener('pageshow',e=>{if(e.persisted)location.reload();});init();
</script></body></html>
