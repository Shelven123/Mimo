<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mimo Beauty Preview</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#101015;color:white;font-family:Arial,sans-serif}.head{padding:18px;display:flex;gap:18px;align-items:center}.head a{color:white;text-decoration:none;font-size:25px}.stage{height:55vh;max-height:630px;background:#000;display:grid;place-items:center;overflow:hidden}.stage canvas{width:100%;height:100%;object-fit:contain}.controls{padding:16px;max-width:600px;margin:auto}.row{margin:12px 0;display:flex;gap:12px;align-items:center}.row label{width:100px}.row input{flex:1}.row b{width:30px}button{border:0;border-radius:12px;padding:14px 18px;background:#fff;font-weight:bold}.note{color:#aaa;font-size:13px;line-height:1.5}#source{display:none}</style></head><body><header class="head"><a href="beauty-settings.html">‹</a><strong>✨ Mimo Beauty — Live Preview</strong></header><div class="stage" id="stage"><span>Opening camera…</span></div><video id="source" autoplay muted playsinline></video><section class="controls"><div class="row"><label><input id="enabled" type="checkbox" checked> Beauty On</label><button id="flip">Flip Camera</button></div><div id="sliders"></div><button id="save">Save Settings</button><p id="status" class="note">Live preview is processed locally on your device. This preview does not change active video calls.</p><p class="note">Smoothing, whitening and rosy tone work now. Face reshaping, makeup, eye adjustments and background segmentation are not implemented yet.</p></section><script type="module">
import { createBeautyEngine } from "./beauty-engine.js";
const sb=window.supabase.createClient("https://zhhgiwqehwuwzxnqbnth.supabase.co","sb_publishable_sPMtACRDzijX9yeeQ_wUUw_QGuOeryJ");
const video=document.getElementById("source"),stage=document.getElementById("stage"),status=document.getElementById("status");
const fields=["smoothing","whitening","rosy"], labels=["Smoothing","Whitening","Rosy Tone"];
let camera=null, engine=null, facing="user", user=null, saved={};
fields.forEach((key,i)=>{const row=document.createElement("div");row.className="row";row.innerHTML='<label>'+labels[i]+'</label><input type="range" min="0" max="100" value="0" id="'+key+'"><b id="'+key+'_value">0</b>';document.getElementById("sliders").append(row)});
function settings(){const o={enabled:document.getElementById("enabled").checked};fields.forEach(k=>o[k]=+document.getElementById(k).value);return o}
function refresh(){fields.forEach(k=>document.getElementById(k+"_value").textContent=document.getElementById(k).value);if(engine)engine.update(settings())}
fields.forEach(k=>document.getElementById(k).addEventListener("input",refresh));document.getElementById("enabled").addEventListener("change",refresh);
async function openCamera(){if(engine){engine.stop();engine=null}if(camera){camera.getTracks().forEach(t=>t.stop());camera=null}camera=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing}},audio:false});video.srcObject=camera;await video.play();engine=createBeautyEngine(video,settings());engine.start();stage.replaceChildren(engine.canvas);refresh();status.textContent="Live beauty processing active (local preview)."}
document.getElementById("flip").onclick=async()=>{facing=facing==="user"?"environment":"user";try{await openCamera()}catch(e){status.textContent=e.message}};
document.getElementById("save").onclick=async()=>{if(!user)return;const r=await sb.from("beauty_settings").upsert({user_id:user.id,...saved,...settings(),preset:"custom"});status.textContent=r.error?r.error.message:"Settings saved ✓"};
(async()=>{try{const r=await sb.auth.getUser();user=r.data.user;if(!user){location.replace("login.html");return}const q=await sb.from("beauty_settings").select("*").eq("user_id",user.id).maybeSingle();saved=q.data||{};document.getElementById("enabled").checked=!!saved.enabled;fields.forEach(k=>document.getElementById(k).value=saved[k]??0);refresh();await openCamera()}catch(e){status.textContent="Camera/processing unavailable: "+e.message}})();
window.addEventListener("pagehide",()=>{if(engine)engine.stop();if(camera)camera.getTracks().forEach(t=>t.stop())});
</script></body></html>
