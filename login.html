```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mimo - Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #fff0f5, #ffe4ed);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 420px;
}

.logo {
  text-align: center;
  font-size: 34px;
  font-weight: bold;
  color: #ff4f81;
  margin-bottom: 8px;
}

.subtitle {
  text-align: center;
  color: #888;
  margin-bottom: 25px;
}

.card {
  background: white;
  border-radius: 22px;
  padding: 28px 22px;
  box-shadow: 0 10px 35px rgba(0,0,0,0.08);
}

.tabs {
  display: flex;
  background: #f5f5f5;
  border-radius: 12px;
  padding: 4px;
  margin-bottom: 22px;
}

.tab {
  flex: 1;
  border: none;
  background: transparent;
  padding: 11px;
  border-radius: 9px;
  font-size: 15px;
  cursor: pointer;
}

.tab.active {
  background: white;
  color: #ff4f81;
  font-weight: bold;
  box-shadow: 0 2px 6px rgba(0,0,0,0.06);
}

.form-group {
  margin-bottom: 15px;
}

label {
  display: block;
  font-size: 13px;
  color: #555;
  margin-bottom: 7px;
}

input {
  width: 100%;
  height: 48px;
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: 0 14px;
  font-size: 15px;
  outline: none;
}

input:focus {
  border-color: #ff4f81;
}

.main-btn {
  width: 100%;
  height: 50px;
  border: none;
  border-radius: 13px;
  background: #ff4f81;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 5px;
}

.main-btn:disabled {
  opacity: 0.6;
}

.message {
  display: none;
  padding: 11px 13px;
  border-radius: 10px;
  margin-bottom: 15px;
  font-size: 13px;
  line-height: 1.4;
}

.message.error {
  display: block;
  background: #fff0f0;
  color: #d33;
}

.message.success {
  display: block;
  background: #effbf3;
  color: #218838;
}

.note {
  text-align: center;
  color: #999;
  font-size: 12px;
  margin-top: 18px;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">❤️ Mimo</div>

  <div class="subtitle">
    Meet people. Make connections.
  </div>

  <div class="card">

    <div class="tabs">

      <button
        id="loginTab"
        class="tab active"
        onclick="showLogin()"
      >
        Login
      </button>

      <button
        id="registerTab"
        class="tab"
        onclick="showRegister()"
      >
        Register
      </button>

    </div>

    <div id="message" class="message"></div>


    <!-- LOGIN -->

    <div id="loginForm">

      <div class="form-group">

        <label>Email</label>

        <input
          id="loginEmail"
          type="email"
          placeholder="Enter your email"
          autocomplete="email"
        >

      </div>

      <div class="form-group">

        <label>Password</label>

        <input
          id="loginPassword"
          type="password"
          placeholder="Enter your password"
          autocomplete="current-password"
        >

      </div>

      <button
        id="loginButton"
        class="main-btn"
        onclick="login()"
      >
        Login
      </button>

    </div>


    <!-- REGISTER -->

    <div id="registerForm" style="display:none;">

      <div class="form-group">

        <label>Email</label>

        <input
          id="registerEmail"
          type="email"
          placeholder="Enter your email"
          autocomplete="email"
        >

      </div>

      <div class="form-group">

        <label>Password</label>

        <input
          id="registerPassword"
          type="password"
          placeholder="At least 6 characters"
          autocomplete="new-password"
        >

      </div>

      <div class="form-group">

        <label>Confirm Password</label>

        <input
          id="registerConfirm"
          type="password"
          placeholder="Confirm your password"
          autocomplete="new-password"
        >

      </div>

      <button
        id="registerButton"
        class="main-btn"
        onclick="register()"
      >
        Create Account
      </button>

    </div>

    <div class="note">
      By continuing, you agree to use Mimo responsibly.
    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://zhhgiwqehwuwzxnqbnth.supabase.co";

/*
  IMPORTANT:
  Put the SAME Publishable / anon key
  that you already use in index.html here.
*/

const SUPABASE_KEY =
  "sb_publishable_sPMtACRDzijX9yeeQ_wUUw_QGuOeryJ";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================
   TABS
========================= */

function showLogin() {

  document.getElementById("loginForm").style.display =
    "block";

  document.getElementById("registerForm").style.display =
    "none";

  document.getElementById("loginTab").classList.add("active");

  document.getElementById("registerTab").classList.remove("active");

  clearMessage();
}


function showRegister() {

  document.getElementById("loginForm").style.display =
    "none";

  document.getElementById("registerForm").style.display =
    "block";

  document.getElementById("loginTab").classList.remove("active");

  document.getElementById("registerTab").classList.add("active");

  clearMessage();
}


/* =========================
   LOGIN
========================= */

async function login() {

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;


  if (!email || !password) {

    showError("Please enter your email and password.");

    return;
  }


  const button =
    document.getElementById("loginButton");

  button.disabled = true;

  button.textContent = "Logging in...";


  const {
    data,
    error
  } = await supabaseClient.auth.signInWithPassword({

    email: email,

    password: password

  });


  if (error) {

    console.error(error);

    showError(error.message);

    button.disabled = false;

    button.textContent = "Login";

    return;
  }


  showSuccess("Login successful!");


  setTimeout(() => {

    window.location.href = "index.html";

  }, 600);

}


/* =========================
   REGISTER
========================= */

async function register() {

  const email =
    document.getElementById("registerEmail").value.trim();

  const password =
    document.getElementById("registerPassword").value;

  const confirm =
    document.getElementById("registerConfirm").value;


  if (!email || !password || !confirm) {

    showError("Please complete all fields.");

    return;
  }


  if (password.length < 6) {

    showError(
      "Password must be at least 6 characters."
    );

    return;
  }


  if (password !== confirm) {

    showError(
      "Passwords do not match."
    );

    return;
  }


  const button =
    document.getElementById("registerButton");

  button.disabled = true;

  button.textContent = "Creating account...";


  const {
    data,
    error
  } = await supabaseClient.auth.signUp({

    email: email,

    password: password

  });


  if (error) {

    console.error(error);

    showError(error.message);

    button.disabled = false;

    button.textContent = "Create Account";

    return;
  }


  /*
    If email confirmation is disabled,
    user may already be logged in.
  */

  if (data.session) {

    showSuccess(
      "Account created successfully!"
    );

    setTimeout(() => {

      window.location.href = "index.html";

    }, 800);

    return;
  }


  /*
    If email confirmation is enabled
  */

  showSuccess(
    "Account created. Please check your email to confirm your account."
  );


  button.disabled = false;

  button.textContent = "Create Account";

}


/* =========================
   MESSAGE
========================= */

function showError(text) {

  const box =
    document.getElementById("message");

  box.className =
    "message error";

  box.textContent =
    text;

}


function showSuccess(text) {

  const box =
    document.getElementById("message");

  box.className =
    "message success";

  box.textContent =
    text;

}


function clearMessage() {

  const box =
    document.getElementById("message");

  box.className =
    "message";

  box.textContent =
    "";

}

</script>

</body>
</html>
```
