```html
<!DOCTYPE html>
<html lang="en">

  <meta charset="UTF-8">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f7f9;
      color: #222;
      padding-bottom: 75px;
    }

    header {
      background: white;

      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-bottom: 1px solid #eee;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 23px;
      font-weight: bold;
      color: #ff4f81;
    }

    .diamond {
      background: #fff0f5;
      color: #ff4f81;
      padding: 8px 12px;
      border-radius: 20px;
      font-weight: bold;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 20px 16px;
    }

    .welcome {
      background: linear-gradient(135deg, #ff4f81, #ff7aa2);
      color: white;
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .welcome h1 {
      font-size: 25px;
      margin-bottom: 8px;
    }

    .welcome p {
      opacity: .95;
    }

    .search {
      width: 100%;
      border: none;
      background: white;
      padding: 14px 16px;
      border-radius: 14px;
      font-size: 15px;
      margin-bottom: 22px;
      outline: none;
      box-shadow: 0 2px 10px rgba(0,0,0,.04);
    }

    .section-title {
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .hosts {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .host-card {
      background: white;
      border-radius: 18px;

      box-shadow: 0 3px 12px rgba(0,0,0,.06);

    .host-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0,0,0,.10);
    }

    .host-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
    }

      padding: 13px;
    }

    .host-name {
      font-size: 17px;

      min-height: 36px;
      line-height: 1.4;
      margin-bottom: 10px;

    .offline {
      font-size: 12px;

    .online {
      color: #21b66f;

      color: #999;
    }

      display: flex;
      gap: 7px;
    }

      border: none;

      flex: 1;
    }

      background: #ff4f81;
      color: white;
    }

    .follow-btn {
      background: #fff0f5;
      color: #ff4f81;
    }

    .empty {
      background: white;
      padding: 35px;
      text-align: center;
      border-radius: 15px;
      color: #888;
      grid-column: 1 / -1;
    }

    .loading {
      background: white;
      padding: 35px;
      text-align: center;
      border-radius: 15px;
      color: #888;
      grid-column: 1 / -1;
    }

    .bottom-nav {
      position: fixed;

      .hosts {
        grid-template-columns: repeat(2, 1fr);

  </style>
</head>

<body>

<header>
  <div class="logo">❤️ Mimo</div>
  <div class="diamond">💎 1,000</div>
</header>

<div class="container">

  <div class="welcome">
    <h1>Welcome to Mimo</h1>
    <p>Meet new people, chat and make meaningful connections.</p>
  </div>

  <input
    id="searchInput"
    class="search"
    type="text"
    placeholder="Search hosts..."
    oninput="filterHosts()"
  >

  <div class="section-title">
    Discover Hosts
  </div>

  <div id="hostList" class="hosts">
    <div class="loading">
      Loading hosts...
    </div>
  </div>

</div>

<div class="bottom-nav">

  <div class="nav-inner">

    <div class="nav-item active">
      <span class="nav-icon">🏠</span>
      Home
    </div>

    <div
      class="nav-item"
      onclick="goTo('plaza.html')"
    >
      <span class="nav-icon">🌐</span>
      Plaza
    </div>

    <div
      class="nav-item"
      onclick="goTo('messages.html')"
    >
      <span class="nav-icon">💬</span>
      Messages
    </div>

    <div
      class="nav-item"
      onclick="goTo('notifications.html')"
    >
      <span class="nav-icon">🔔</span>
      Notifications
    </div>

    <div
      class="nav-item"
      onclick="goTo('me.html')"
    >
      <span class="nav-icon">👤</span>
      Me
    </div>

  </div>

</div>

<script>

const SUPABASE_URL =
  "https://zhhgiwqehwuwzxnqbnth.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_sPMtACRDzijX9yeeQ_wUUw_QGuOeryJ";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

let allHosts = [];


/* =========================
   LOAD HOSTS
========================= */

async function loadHosts() {

  const hostList =
    document.getElementById("hostList");

  try {

    const { data, error } =
      await supabaseClient
        .from("profiles")
        .select(`
          id,
          username,
          display_name,
          avatar_url,
          bio,
          role,
          online_status
        `)
        .eq("role", "host")
        .order("created_at", {
          ascending: false
        });

    if (error) {

      console.error(error);

      hostList.innerHTML = `
        <div class="empty">
          Unable to load hosts.<br>
          Please try again later.
        </div>
      `;

      return;
    }

    allHosts = data || [];

    renderHosts(allHosts);

  } catch (err) {

    console.error(err);

    hostList.innerHTML = `
      <div class="empty">
        Something went wrong.
      </div>
    `;

  }
}


/* =========================
   RENDER HOSTS
========================= */

function renderHosts(hosts) {

  const hostList =
    document.getElementById("hostList");

  if (!hosts.length) {

    hostList.innerHTML = `
      <div class="empty">
        No hosts available yet.
      </div>
    `;

    return;
  }

  hostList.innerHTML =
    hosts.map(host => {

      const name =
        host.display_name ||
        host.username ||
        "Host";

      const avatar =
        host.avatar_url ||
        "https://i.pravatar.cc/500";

      const bio =
        host.bio ||
        "Nice to meet you ❤️";

      const isOnline =
        host.online_status === "online";

      return `

        <div
          class="host-card"
          onclick="openProfile('${host.id}')"
        >

          <img
            class="host-image"
            src="${avatar}"
            alt="${name}"
          >

          <div class="host-info">

            <div class="host-name">
              ${name}
            </div>

            <div class="host-bio">
              ${bio}
            </div>

            <div class="${isOnline ? "online" : "offline"}">
              ${isOnline ? "🟢 Online" : "⚪ Offline"}
            </div>

            <div class="buttons">

              <button
                class="chat-btn"
                onclick="event.stopPropagation(); chatWithHost('${host.id}')"
              >
                💬 Chat
              </button>

              <button
                class="follow-btn"
                onclick="event.stopPropagation(); followHost('${host.id}')"
              >
                ❤️ Follow
              </button>

            </div>

          </div>

        </div>

      `;

    }).join("");
}


/* =========================
   SEARCH
========================= */

function filterHosts() {

  const keyword =
    document
      .getElementById("searchInput")
      .value
      .toLowerCase()
      .trim();

  const filtered =
    allHosts.filter(host => {

      const name =
        (host.display_name || "")
          .toLowerCase();

      const username =
        (host.username || "")
          .toLowerCase();

      const bio =
        (host.bio || "")
          .toLowerCase();

      return (
        name.includes(keyword) ||
        username.includes(keyword) ||
        bio.includes(keyword)
      );

    });

  renderHosts(filtered);
}


/* =========================
   OPEN PROFILE
========================= */

function openProfile(hostId) {

  window.location.href =
    "profile.html?id=" +
    encodeURIComponent(hostId);

}


/* =========================
   CHAT
========================= */

function chatWithHost(hostId) {

  window.location.href =
    "chat.html?host=" +
    encodeURIComponent(hostId);

}


/* =========================
   FOLLOW
========================= */

function followHost(hostId) {

  alert(
    "Follow system will be connected next."
  );

}


/* =========================
   NAVIGATION
========================= */

function goTo(page) {

  window.location.href = page;

}


/* =========================
   START
========================= */

loadHosts();

</script>

</body>
</html>
