<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mimo</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f7f9;
      color: #222;
      padding-bottom: 75px;
    }

    header {
      background: white;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-bottom: 1px solid #eee;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 23px;
      font-weight: bold;
      color: #ff4f81;
    }

    .diamond {
      background: #fff0f5;
      color: #ff4f81;
      padding: 8px 12px;
      border-radius: 20px;
      font-weight: bold;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 20px 16px;
    }

    .welcome {
      background: linear-gradient(135deg, #ff4f81, #ff7aa2);
      color: white;
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .welcome h1 {
      font-size: 25px;
      margin-bottom: 8px;
    }

    .welcome p {
      opacity: .95;
    }

    .search {
      width: 100%;
      border: none;
      background: white;
      padding: 14px 16px;
      border-radius: 14px;
      font-size: 15px;
      margin-bottom: 22px;
      outline: none;
      box-shadow: 0 2px 10px rgba(0,0,0,.04);
    }

    .section-title {
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .hosts {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .host-card {
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(0,0,0,.06);
    }

    .host-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
    }

    .host-info {
      padding: 13px;
    }

    .host-name {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .host-bio {
      font-size: 13px;
      color: #777;
      min-height: 36px;
      line-height: 1.4;
      margin-bottom: 10px;
    }

    .online {
      color: #21b66f;
      font-size: 12px;
      margin-bottom: 11px;
    }

    .buttons {
      display: flex;
      gap: 7px;
    }

    button {
      border: none;
      cursor: pointer;
      border-radius: 10px;
      padding: 9px;
      font-weight: bold;
      flex: 1;
    }

    .chat-btn {
      background: #ff4f81;
      color: white;
    }

    .follow-btn {
      background: #fff0f5;
      color: #ff4f81;
    }

    .empty {
      background: white;
      padding: 35px;
      text-align: center;
      border-radius: 15px;
      color: #888;
      grid-column: 1 / -1;
    }

    .loading {
      background: white;
      padding: 35px;
      text-align: center;
      border-radius: 15px;
      color: #888;
      grid-column: 1 / -1;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 68px;
      background: white;
      border-top: 1px solid #eee;
      display: flex;
      justify-content: center;
      z-index: 20;
    }

    .nav-inner {
      width: 100%;
      max-width: 700px;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .nav-item {
      text-align: center;
      font-size: 12px;
      color: #777;
      cursor: pointer;
    }

    .nav-item.active {
      color: #ff4f81;
      font-weight: bold;
    }

    .nav-icon {
      font-size: 21px;
      display: block;
      margin-bottom: 3px;
    }

    @media (max-width: 900px) {
      .hosts {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 650px) {
      .hosts {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 400px) {
      .hosts {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .container {
        padding: 14px 10px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">❤️ Mimo</div>
  <div class="diamond">💎 1,000</div>
</header>

<div class="container">

  <div class="welcome">
    <h1>Welcome to Mimo</h1>
    <p>Meet new people, chat and make meaningful connections.</p>
  </div>

  <input
    id="searchInput"
    class="search"
    type="text"
    placeholder="Search hosts..."
    oninput="filterHosts()"
  >

  <div class="section-title">
    Discover Hosts
  </div>

  <div id="hostList" class="hosts">
    <div class="loading">
      Loading hosts...
    </div>
  </div>

</div>

<div class="bottom-nav">
  <div class="nav-inner">

    <div class="nav-item active">
      <span class="nav-icon">🏠</span>
      Home
    </div>

    <div class="nav-item" onclick="goTo('plaza.html')">
      <span class="nav-icon">🌐</span>
      Plaza
    </div>

    <div class="nav-item" onclick="goTo('messages.html')">
      <span class="nav-icon">💬</span>
      Messages
    </div>

    <div class="nav-item" onclick="goTo('notifications.html')">
      <span class="nav-icon">🔔</span>
      Notifications
    </div>

    <div class="nav-item" onclick="goTo('me.html')">
      <span class="nav-icon">👤</span>
      Me
    </div>

  </div>
</div>

<script>

const SUPABASE_URL = "https://zhhgiwqehwuwzxnqbnth.supabase.co";

/*
  这里使用 Supabase Publishable/Anon Key。
  不要把 service_role / secret key 放到这里。
*/
const SUPABASE_KEY = "sb_publishable_sPMtACRDzijX9yeeQ_wUUw_QGuOeryJ";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

let allHosts = [];

async function loadHosts() {

  const hostList = document.getElementById("hostList");

  try {

    const { data, error } = await supabaseClient
      .from("profiles")
      .select(`
        id,
        username,
        display_name,
        avatar_url,
        bio,
        role,
        online_status
      `)
      .eq("role", "host")
      .order("created_at", { ascending: false });

    if (error) {
      console.error(error);

      hostList.innerHTML = `
        <div class="empty">
          Unable to load hosts.<br>
          Please check Supabase configuration.
        </div>
      `;

      return;
    }

    allHosts = data || [];

    renderHosts(allHosts);

  } catch (err) {

    console.error(err);

    hostList.innerHTML = `
      <div class="empty">
        Something went wrong.
      </div>
    `;
  }
}

function renderHosts(hosts) {

  const hostList = document.getElementById("hostList");

  if (!hosts.length) {

    hostList.innerHTML = `
      <div class="empty">
        No hosts available yet.
      </div>
    `;

    return;
  }

  hostList.innerHTML = hosts.map(host => {

    const name =
      host.display_name ||
      host.username ||
      "Host";

    const avatar =
      host.avatar_url ||
      "https://i.pravatar.cc/500";

    const bio =
      host.bio ||
      "Nice to meet you ❤️";

    return `
      <div class="host-card">

        <img
          class="host-image"
          src="${avatar}"
          alt="${name}"
        >

        <div class="host-info">

          <div class="host-name">
            ${name}
          </div>

          <div class="host-bio">
            ${bio}
          </div>

          <div class="online">
            🟢 Online
          </div>

          <div class="buttons">

            <button
              class="chat-btn"
              onclick="chatWithHost('${host.id}')"
            >
              Chat
            </button>

            <button
              class="follow-btn"
              onclick="followHost('${host.id}')"
            >
              Follow
            </button>

          </div>

        </div>

      </div>
    `;

  }).join("");
}

function filterHosts() {

  const keyword =
    document
      .getElementById("searchInput")
      .value
      .toLowerCase()
      .trim();

  const filtered = allHosts.filter(host => {

    const name =
      (host.display_name || "").toLowerCase();

    const username =
      (host.username || "").toLowerCase();

    const bio =
      (host.bio || "").toLowerCase();

    return (
      name.includes(keyword) ||
      username.includes(keyword) ||
      bio.includes(keyword)
    );

  });

  renderHosts(filtered);
}

function chatWithHost(hostId) {

  window.location.href =
    "chat.html?host=" +
    encodeURIComponent(hostId);
}

function followHost(hostId) {

  alert("Follow system will be connected next.");

}

function goTo(page) {

  window.location.href = page;

}

loadHosts();

</script>

</body>
</html>
