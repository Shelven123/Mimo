<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mimo</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      position: fixed;
      inset: 0;
      height: 100%;
      height: 100dvh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      overflow: hidden;
      overscroll-behavior: none;
      font-family: Arial, sans-serif;
      background: #f8f8fb;
      color: #222;
      padding-bottom: 0;
    }

    button, input {
      font: inherit;
    }

    button {
      border: none;
      cursor: pointer;
    }

    /* HEADER */

    header {
      height: calc(64px + env(safe-area-inset-top));
      background: rgba(255,255,255,.96);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: env(safe-area-inset-top) 18px 0;
      border-bottom: 1px solid #f0f0f0;
      position: relative;
      z-index: 30;
    }

    .logo {
      color: #ff4f81;
      font-size: 24px;
      font-weight: 800;
    }

    .diamond {
      background: #fff0f5;
      color: #ff4f81;
      padding: 9px 13px;
      border-radius: 22px;
      font-size: 14px;
      font-weight: 700;
    }

    .container {
      width: 100%;
      max-width: 1050px;
      margin: 0 auto;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior-y: contain;
      -webkit-overflow-scrolling: touch;
      scroll-padding-block: 16px;
      padding: 18px 16px 25px;
    }

    /* GREETING */

    .hello {
      margin-bottom: 16px;
    }

    .hello-small {
      color: #999;
      font-size: 14px;
      margin-bottom: 4px;
    }

    .hello-title {
      font-size: 24px;
      font-weight: 800;
    }

    /* SEARCH */

    .search-box {
      position: relative;
      margin-bottom: 22px;
    }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 17px;
    }

    .search {
      width: 100%;
      border: 1px solid #eee;
      background: white;
      padding: 14px 16px 14px 45px;
      border-radius: 16px;
      outline: none;
      font-size: 15px;
      box-shadow: 0 3px 14px rgba(0,0,0,.035);
    }

    /* SECTION */

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 13px;
    }

    .section-title {
      font-size: 20px;
      font-weight: 800;
    }

    .section-link {
      color: #ff4f81;
      font-size: 13px;
      font-weight: 700;
    }

    /* STORIES */

    .story-section {
      margin-bottom: 24px;
    }

    .stories {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      overscroll-behavior-x: contain;
      padding: 3px 1px 7px;
      scrollbar-width: none;
    }

    .stories::-webkit-scrollbar {
      display: none;
    }

    .story {
      min-width: 68px;
      text-align: center;
      cursor: pointer;
    }

    .story-ring {
      width: 65px;
      height: 65px;
      margin: auto;
      padding: 3px;
      border-radius: 50%;
      background: linear-gradient(135deg,#ff4f81,#ff9d5c);
      position: relative;
    }

    .story-ring img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid white;
      display: block;
    }

    .story-name {
      font-size: 12px;
      margin-top: 6px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .add-story-ring {
      background: #f0f0f3;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .add-story-circle {
      width: 59px;
      height: 59px;
      background: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 27px;
      color: #ff4f81;
    }

    /* FILTERS */

    .filters {
      display: flex;
      gap: 9px;
      overflow-x: auto;
      margin-bottom: 24px;
      scrollbar-width: none;
    }

    .filters::-webkit-scrollbar {
      display: none;
    }

    .filter {
      white-space: nowrap;
      padding: 10px 15px;
      border-radius: 22px;
      background: white;
      color: #777;
      border: 1px solid #eee;
      font-size: 13px;
      font-weight: 700;
    }

    .filter.active {
      background: #ff4f81;
      color: white;
      border-color: #ff4f81;
    }

    /* HOST GRID */

    .hosts {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 17px;
    }

    .host-card {
      position: relative;
      background: white;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 5px 20px rgba(0,0,0,.07);
      cursor: pointer;
    }

    .photo-wrap {
      position: relative;
      aspect-ratio: 4 / 5;
      background: #eee;
      overflow: hidden;
    }

    .host-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .3s ease;
    }

    .host-card:hover .host-image {
      transform: scale(1.025);
    }

    .photo-gradient {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 48%;
      background: linear-gradient(
        transparent,
        rgba(0,0,0,.67)
      );
      pointer-events: none;
    }

    .status {
      position: absolute;
      top: 13px;
      left: 13px;
      background: rgba(255,255,255,.93);
      border-radius: 20px;
      padding: 6px 9px;
      font-size: 11px;
      font-weight: 700;
    }

    .status.online {
      color: #13a866;
    }

    .status.offline {
      color: #777;
    }

    .photo-info {
      position: absolute;
      left: 15px;
      right: 15px;
      bottom: 14px;
      color: white;
    }

    .host-name {
      font-size: 21px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .host-bio {
      font-size: 12px;
      opacity: .92;
      line-height: 1.35;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    /* ACTIONS */

    .actions {
      display: grid;
      grid-template-columns: repeat(4,1fr);
      gap: 4px;
      padding: 11px 7px 12px;
    }

    .action {
      background: transparent;
      padding: 4px 2px;
      min-width: 0;
      color: #777;
    }

    .action-icon {
      width: 39px;
      height: 39px;
      margin: auto;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      background: #f6f6f8;
    }

    .action-text {
      display: block;
      margin-top: 5px;
      font-size: 10px;
      font-weight: 700;
    }

    .chat-action .action-icon {
      background: #fff0f5;
      color: #ff4f81;
    }

    .call-action .action-icon {
      background: #f0f8ff;
    }

    .video-action .action-icon {
      background: #f3f0ff;
    }

    .follow-action .action-icon {
      background: #fff0f5;
      color: #ff4f81;
    }

    .follow-action.following .action-icon {
      background: #ff4f81;
      color: white;
    }

    .follow-action.following {
      color: #ff4f81;
    }

    .action:disabled {
      opacity: .6;
      cursor: default;
    }

    /* EMPTY */

    .empty,
    .loading {
      grid-column: 1 / -1;
      background: white;
      padding: 40px 20px;
      border-radius: 18px;
      color: #999;
      text-align: center;
    }

    /* NAV */

    .bottom-nav {
      position: relative;
      height: calc(70px + env(safe-area-inset-bottom));
      padding-bottom: env(safe-area-inset-bottom);
      background: rgba(255,255,255,.97);
      border-top: 1px solid #eee;
      z-index: 50;
      display: flex;
      justify-content: center;
    }

    .nav-inner {
      width: 100%;
      max-width: 700px;
      display: flex;
      align-items: center;
      justify-content: space-around;
    }

    .nav-item {
      color: #999;
      font-size: 11px;
      text-align: center;
      cursor: pointer;
      min-width: 55px;
    }

    .nav-icon {
      display: block;
      font-size: 21px;
      margin-bottom: 3px;
    }

    .nav-item.active {
      color: #ff4f81;
      font-weight: 800;
    }

    @media (max-width: 800px) {
      .hosts {
        grid-template-columns: repeat(2,1fr);
      }
    }

    @media (max-width: 520px) {
      .container {
        padding: 16px 11px 22px;
      }

      .hosts {
        gap: 11px;
      }

      .host-card {
        border-radius: 18px;
      }

      .photo-wrap {
        aspect-ratio: 3 / 4;
      }

      .host-name {
        font-size: 18px;
      }

      .actions {
        padding-left: 3px;
        padding-right: 3px;
      }

      .action-icon {
        width: 34px;
        height: 34px;
        font-size: 16px;
      }

      .action-text {
        font-size: 9px;
      }
    }
  
    .incoming-call {
      position: fixed; inset: 0; z-index: 9999;
      background: rgba(30,20,35,.62);
      display: none; align-items: center; justify-content: center;
      padding: 24px;
    }
    .incoming-call.show { display: flex; }
    .incoming-card {
      width: min(92vw, 360px); background: white; border-radius: 28px;
      padding: 28px 22px 24px; text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,.22);
    }
    .incoming-avatar {
      width: 96px; height: 96px; border-radius: 50%;
      object-fit: cover; background: #fff0f5;
    }
    .incoming-name { margin-top: 14px; font-size: 23px; font-weight: 800; }
    .incoming-label { margin-top: 6px; color: #777; }
    .incoming-actions { display: flex; gap: 28px; justify-content: center; margin-top: 24px; }
    .incoming-btn {
      width: 64px; height: 64px; border: 0; border-radius: 50%;
      color: white; font-size: 25px; cursor: pointer;
    }
    .incoming-decline { background: #ff3b57; }
    .incoming-accept { background: #28c76f; }

</style>

<script>

const SUPABASE_URL =
  "https://zhhgiwqehwuwzxnqbnth.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_sPMtACRDzijX9yeeQ_wUUw_QGuOeryJ";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let allHosts = [];
let lastHostRead=0;
let currentUser = null;
let homeIdentityReady=null;
let currentProfile = null;
let followedHostIds = new Set();
let currentFilter = "all";


/* =========================
   CURRENT USER
========================= */

async function loadCurrentUser() {

  const {
    data,
    error
  } = await supabaseClient.auth.getUser();

  if (error) {
    console.error("Auth error:", error);
    currentUser = null;
    return;
  }

  currentUser = data.user || null;

  if (currentUser) {
    const { data: profile } = await supabaseClient
      .from("profiles")
      .select("id, role")
      .eq("id", currentUser.id)
      .maybeSingle();
    currentProfile = profile || null;
  }
}


/* =========================
   FOLLOWING
========================= */

async function loadFollowing() {

  followedHostIds = new Set();

  if (!currentUser) return;

  const {
    data,
    error
  } = await supabaseClient
    .from("follows")
    .select("following_id")
    .eq("follower_id", currentUser.id);

  if (error) {
    console.error("Following error:", error);
    return;
  }

  (data || []).forEach(item => {
    followedHostIds.add(item.following_id);
  });
}


/* =========================
   HOSTS
========================= */

async function loadHosts() {

  const hostList =
    document.getElementById("hostList");

  const {
    data,
    error
  } = await supabaseClient
    .from("profiles")
    .select(`
      id,
      username,
      display_name,
      avatar_url,
      bio,
      role,
      online_status
    `)
    .eq("role", "host")
    .order("created_at", {
      ascending: false
    });

  if (error) {

    console.error(error);

    hostList.innerHTML = `
      <div class="empty">
        Unable to load hosts.
      </div>
    `;

    return;
  }

  allHosts = data || [];lastHostRead=Date.now();

  renderStories();
  applyFilters();
}


/* =========================
   STORIES UI
========================= */

function renderStories() {

  const storyList =
    document.getElementById("storyList");

  let html = `

    <div
      class="story"
      onclick="storyComingSoon()"
    >

      <div class="story-ring add-story-ring">
        <div class="add-story-circle">
          ＋
        </div>
      </div>

      <div class="story-name">
        Your Story
      </div>

    </div>
  `;

  allHosts.slice(0, 8).forEach(host => {

    const name =
      host.display_name ||
      host.username ||
      "Host";

    const avatar =
      host.avatar_url ||
      "https://i.pravatar.cc/500";

    html += `

      <div
        class="story"
        onclick="storyComingSoon()"
      >

        <div class="story-ring">

          <img
            src="${escapeHtml(avatar)}"
            alt="${escapeHtml(name)}"
          >

        </div>

        <div class="story-name">
          ${escapeHtml(name)}
        </div>

      </div>
    `;
  });

  storyList.innerHTML = html;
}


/* =========================
   RENDER HOSTS
========================= */

function renderHosts(hosts) {
  const photo=document.getElementById('mimoHeroPhoto');
  const featured=hosts.find(host=>MimoHosts.url(host.avatar_url));
  if(photo){photo.hidden=!featured;if(featured){photo.src=MimoHosts.url(featured.avatar_url);photo.alt=featured.display_name||featured.username||'Featured Host';}}


  const hostList =
    document.getElementById("hostList");

  if (!hosts.length) {

    hostList.innerHTML = `
      <div class="empty">
        No hosts found.
      </div>
    `;

    return;
  }


  const hot=document.getElementById("referenceHotHosts");if(hot){hot.replaceChildren();for(const host of hosts.slice(0,6)){const b=document.createElement("button");b.type="button";b.className="reference-hot-card";b.onclick=()=>openProfile(host.id);const img=document.createElement("img");const url=MimoHosts.url(host.avatar_url);if(url)img.src=url;else img.hidden=true;img.alt="";const name=document.createElement("span");name.textContent=host.display_name||host.username||"Host";b.append(img,name);hot.append(b);}}
  hostList.innerHTML =
    hosts.map(host => {

      const name =
        host.display_name ||
        host.username ||
        "Host";

      const avatar =
        host.avatar_url ||
        "https://i.pravatar.cc/500";

      const bio =
        host.bio ||
        "Nice to meet you ❤️";

      const online =
        host.online_status === "online";

      const following =
        followedHostIds.has(host.id);


      return `

        <article class="host-card">

          <div
            class="photo-wrap" role="button" tabindex="0"
            onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click();}"
            onclick="openProfile('${host.id}')"
          >

            <img
              class="host-image"
              src="${escapeHtml(avatar)}"
              alt="${escapeHtml(name)}"
            >

            <div class="photo-gradient"></div>

            <div
              class="status ${online ? "online" : "offline"}"
            >
              ${online ? "● Online" : "○ Offline"}
            </div>

            <div class="photo-info">

              <div class="host-name">
                ${escapeHtml(name)}
              </div>

              <div class="host-bio">
                ${escapeHtml(bio)}
              </div>

            </div>

          </div>


          <div class="actions">

            <button
              class="action chat-action"
              onclick="chatWithHost('${host.id}')"
            >
              <span class="action-icon">💬</span>
              <span class="action-text">Chat</span>
            </button>


            ${currentProfile?.role === "user" ? `
            <button
              class="action call-action"
              onclick="callComingSoon('${host.id}')"
            >
              <span class="action-icon">📞</span>
              <span class="action-text">Call</span>
            </button>
            ` : `<div class="action"></div>`}


            ${currentProfile?.role === "user" ? `
            <button
              class="action video-action"
              onclick="videoComingSoon('${host.id}')"
            >
              <span class="action-icon">🎥</span>
              <span class="action-text">Video</span>
            </button>
            ` : `<div class="action"></div>`}


            <button
              id="follow-${host.id}"
              class="action follow-action ${following ? "following" : ""}"
              onclick="followHost('${host.id}')"
            >

              <span class="action-icon">
                ${following ? "♥" : "♡"}
              </span>

              <span class="action-text">
                ${following ? "Following" : "Follow"}
              </span>

            </button>

          </div>

        </article>
      `;

    }).join("");
}

function filterHosts() {
  applyFilters();
}


function setFilter(filter, button) {

  currentFilter = filter;

  document
    .querySelectorAll(".filter")
    .forEach(item => {
      item.classList.remove("active");
    });

  button.classList.add("active");

  applyFilters();
}


function applyFilters() {

  const keyword =
    document
      .getElementById("searchInput")
      .value
      .toLowerCase()
      .trim();


  let filtered =
    allHosts.filter(host => {

      const text = `
        ${host.display_name || ""}
        ${host.username || ""}
        ${host.bio || ""}
      `.toLowerCase();

      return text.includes(keyword);
    });


  if (currentFilter === "online") {

    filtered =
      filtered.filter(host =>
        host.online_status === "online"
      );

  }

  /*
    Popular 和 Video Call
    等相关真实数据完成后再接筛选。
    现在不会制造假的数据库状态。
  */

  renderHosts(filtered);
}

/* =========================
   FOLLOW
========================= */

async function followHost(hostId) {
  if(homeIdentityReady)await homeIdentityReady;

  if (!currentUser) {

    alert("Please login first.");

    return;
  }


  if (currentUser.id === hostId) {
    return;
  }


  const button =
    document.getElementById(
      "follow-" + hostId
    );


  if (button) {
    button.disabled = true;
  }


  const currentlyFollowing =
    followedHostIds.has(hostId);


  if (currentlyFollowing) {

    const {
      error
    } = await supabaseClient
      .from("follows")
      .delete()
      .eq("follower_id", currentUser.id)
      .eq("following_id", hostId);


    if (error) {

      console.error(error);

      alert("Unable to unfollow.");

      if (button) {
        button.disabled = false;
      }

      return;
    }


    followedHostIds.delete(hostId);

  } else {
    if(!await MimoContacts.allow(supabaseClient,hostId,"follow")){if(button)button.disabled=false;return;}

    const {
      error
    } = await supabaseClient
      .from("follows")
      .insert({
        follower_id: currentUser.id,
        following_id: hostId
      });


    if (error) {

      console.error(error);

      alert("Unable to follow.");

      if (button) {
        button.disabled = false;
      }

      return;
    }


    followedHostIds.add(hostId);
  }


  applyFilters();
}

/* =========================
   SAFE TEXT
========================= */

function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent =
    text == null
      ? ""
      : String(text);

  return div.innerHTML.replaceAll('"','&quot;').replaceAll("'",'&#39;');
}



let incomingCallRecord = null;
let incomingCallChannel = null;

async function startIncomingCallListener() {
  if (!currentUser || currentProfile?.role !== "host") return;

  const { data: existing } = await supabaseClient
    .from("calls")
    .select("*")
    .eq("callee_id", currentUser.id)
    .eq("status", "ringing")
    .order("created_at", { ascending: false })
    .limit(1);

  if (existing && existing.length) {
    const latest = existing[0];
    const createdAt = new Date(latest.created_at).getTime();
    const isFresh = Number.isFinite(createdAt) && (Date.now() - createdAt) < 60000;

    if (isFresh) {
      await showIncomingCall(latest);
    } else {
      await supabaseClient
        .from("calls")
        .update({
          status: "missed",
          ended_at: new Date().toISOString()
        })
        .eq("id", latest.id)
        .eq("status", "ringing");
    }
  }

  incomingCallChannel = supabaseClient
    .channel("incoming-calls-" + currentUser.id)
    .on("postgres_changes", {
      event: "INSERT",
      schema: "public",
      table: "calls",
      filter: "callee_id=eq." + currentUser.id
    }, async payload => {
      if (payload.new && payload.new.status === "ringing") {
        await showIncomingCall(payload.new);
      }
    })
    .on("postgres_changes", {
      event: "UPDATE",
      schema: "public",
      table: "calls",
      filter: "callee_id=eq." + currentUser.id
    }, payload => {
      if (incomingCallRecord && payload.new.id === incomingCallRecord.id &&
          payload.new.status !== "ringing") {
        hideIncomingCall();
      }
    })
    .subscribe();
}

async function showIncomingCall(call) {
  incomingCallRecord = call;
  const { data: caller } = await supabaseClient
    .from("profiles")
    .select("display_name, username, avatar_url")
    .eq("id", call.caller_id)
    .maybeSingle();

  document.getElementById("incomingName").textContent =
    caller?.display_name || caller?.username || "Mimo User";

  const incomingLabel = document.querySelector(".incoming-label");
  if (incomingLabel) {
    incomingLabel.textContent =
      call.call_type === "video"
        ? "Incoming video call"
        : "Incoming voice call";
  }

  const avatar = document.getElementById("incomingAvatar");
  avatar.src = caller?.avatar_url ||
    "data:image/svg+xml;charset=UTF-8," +
    encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300"><rect width="100%" height="100%" fill="#fff0f5"/><circle cx="150" cy="115" r="55" fill="#ffb3c8"/><circle cx="150" cy="275" r="100" fill="#ffb3c8"/></svg>');

  document.getElementById("incomingCall").classList.add("show");
}

function hideIncomingCall() {
  document.getElementById("incomingCall").classList.remove("show");
  incomingCallRecord = null;
}

function acceptIncomingCall() {
  if (!incomingCallRecord) return;
  window.top.location.href = "call.html?call=" +
    encodeURIComponent(incomingCallRecord.id);
}

async function declineIncomingCall() {
  if (!incomingCallRecord) return;
  const id = incomingCallRecord.id;
  await supabaseClient.from("calls").update({
    status: "declined",
    ended_at: new Date().toISOString()
  }).eq("id", id);
  hideIncomingCall();
}
