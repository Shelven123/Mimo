<main><label class="inbox-search replica-hidden"><span data-message-icon="search"></span><input id="inboxSearch" type="search" placeholder="Search your conversations" aria-label="Search loaded conversations" autocomplete="off"></label><p id="searchNote" hidden="">Searching conversations loaded on this page. Load more to search older chats.</p><p id="quickLabel" class="quick-label replica-hidden" hidden="">Quick chats</p><div id="quickChats" class="quick-chats replica-hidden"></div><div class="inbox-heading replica-hidden"><h2>Your conversations</h2><div class="inbox-filters"><button data-inbox-filter="all" class="active" aria-pressed="true">All</button><button data-inbox-filter="unread" aria-pressed="false">Unread</button></div></div><p id="status" class="notice" role="status">Loading conversations…</p><div id="list"></div><button id="more" type="button" hidden="">Load more</button></main>

<script>
const sb=window.supabase.createClient('https://zhhgiwqehwuwzxnqbnth.supabase.co','sb_publishable_sPMtACRDzijX9yeeQ_wUUw_QGuOeryJ');
const status=document.getElementById('status'),list=document.getElementById('list'),more=document.getElementById('more'),refresh=document.getElementById('refresh');
let loadedRows=[],inboxMode='all',userId=null,pages=1,busy=false,disposed=false,channel=null,poll=null,debounce=null,hasMore=false,authSubscription=null;
async function load(extra=false){
  if(disposed||busy||!userId)return;busy=true;refresh.disabled=true;more.disabled=true;
  const requested=pages+(extra?1:0),rows=[],seen=new Set();
  try{
    let last=[];
    for(let page=0;page<requested;page++){
      last=await MimoMessages.inbox(sb,page*MimoMessages.PAGE_SIZE);
      if(disposed)return;
      for(const row of last){if(!seen.has(row.conversation_id)){seen.add(row.conversation_id);rows.push(row);}}
      if(last.length<MimoMessages.PAGE_SIZE)break;
    }
    loadedRows=rows;pages=requested;hasMore=last.length===MimoMessages.PAGE_SIZE;renderView();
    more.hidden=!hasMore;renderView();
  }catch(error){if(!disposed){status.className='notice error';status.textContent='Unable to load messages. Tap Refresh to retry.';}}
  finally{busy=false;if(!disposed){refresh.disabled=false;more.disabled=false;}}
}
function renderView(){if(disposed||!userId)return;const search=document.getElementById('inboxSearch').value,UI=window.MimoMessagingUI,rows=UI?UI.filter(loadedRows,search,inboxMode):loadedRows;list.replaceChildren(MimoMessages.renderInbox(document,rows));if(UI)document.getElementById('quickChats').replaceChildren(UI.quick(document,loadedRows));document.getElementById('quickLabel').hidden=!loadedRows.length;document.getElementById('searchNote').hidden=!search.trim();status.className='notice';status.textContent=rows.length?'':search.trim()?'No matching loaded conversations.':inboxMode==='unread'?'You’re all caught up.':'No conversations yet. Choose a contact to start chatting.';}
window.MimoMessagingUI?.hydrate(document);document.getElementById('inboxSearch').oninput=renderView;for(const filter of document.querySelectorAll('[data-inbox-filter]'))filter.onclick=()=>{inboxMode=filter.dataset.inboxFilter;for(const node of document.querySelectorAll('[data-inbox-filter]')){node.classList.toggle('active',node===filter);node.setAttribute('aria-pressed',String(node===filter));}renderView();};
function schedule(){if(disposed||document.visibilityState==='hidden')return;clearTimeout(debounce);debounce=setTimeout(()=>load(),400);}
function cleanup(){disposed=true;userId=null;loadedRows=[];list.replaceChildren();more.hidden=true;refresh.disabled=true;document.getElementById('inboxSearch').value='';document.getElementById('quickChats').replaceChildren();document.getElementById('quickLabel').hidden=true;document.getElementById('searchNote').hidden=true;clearInterval(poll);clearTimeout(debounce);if(channel)sb.removeChannel(channel);if(authSubscription)authSubscription.unsubscribe();}
async function init(){
  try{
    authSubscription=sb.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'||(userId&&session&&session.user.id!==userId)){cleanup();list.replaceChildren();more.hidden=true;refresh.disabled=true;status.textContent='Your session changed. Reload or sign in again.';}}).data.subscription;
    const {data,error}=await sb.auth.getUser();if(error)throw error;
    if(disposed)return;
    if(!data.user){status.textContent='Sign in to see your conversations.';const link=document.createElement('a');link.href='login.html';link.textContent=' Sign in';status.append(link);refresh.disabled=true;return;}
    userId=data.user.id;await load();
    if(disposed)return;
    channel=sb.channel('mimo-inbox-'+userId).on('postgres_changes',{event:'*',schema:'public',table:'messages'},schedule).on('postgres_changes',{event:'INSERT',schema:'public',table:'conversations'},schedule).subscribe();
    poll=setInterval(schedule,15000);
  }catch(error){status.textContent='Unable to check your login. Reload to retry.';}
}
refresh.onclick=()=>load();more.onclick=()=>load(true);document.addEventListener('visibilitychange',schedule);window.addEventListener('pagehide',cleanup);window.addEventListener('pageshow',event=>{if(event.persisted)location.reload();});init();
</script><script src="./foreground-notices.js?v=20261012-alert2"></script>
