<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Mimo — Messages</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./message-center.js?v=20261010-inbox1"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f7f7f9;color:#222}header{display:flex;align-items:center;gap:14px;background:#fff;padding:14px 16px;position:sticky;top:0;z-index:1;border-bottom:1px solid #eee}h1{font-size:22px;margin:0;flex:1}a{color:inherit;text-decoration:none}button{font:inherit;border:0;border-radius:20px;padding:10px 15px;background:#fff0f5;color:#d83e68;cursor:pointer}button:disabled{opacity:.5}.back{font-size:26px;padding:0 8px}main{max-width:720px;margin:auto;padding:12px 12px calc(80px + env(safe-area-inset-bottom))}.conversation{display:flex;align-items:center;gap:12px;padding:16px;background:#fff;border-radius:16px;margin-bottom:10px;min-height:86px}.avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;flex-shrink:0}.info{flex:1;min-width:0}.name{font-weight:700;margin-bottom:7px}.preview{color:#777;font-size:14px}.name,.preview{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{display:flex;flex-direction:column;align-items:flex-end;gap:8px;font-size:12px;color:#999}.unread{background:#ff4f81;color:#fff;border-radius:14px;min-width:22px;padding:4px 7px;text-align:center}.notice{color:#777;text-align:center;margin:22px 8px}.error{color:#b72f53}#more{display:block;margin:16px auto}#more[hidden]{display:none}footer{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:#fff;border-top:1px solid #eee;padding:14px 12px calc(14px + env(safe-area-inset-bottom));font-size:14px}.active{color:#d83e68;font-weight:700}
</style></head><body>
<header><a class="back" href="index.html" aria-label="Back to home">‹</a><h1>Messages</h1><button id="refresh" type="button">Refresh</button></header>
<main><p id="status" class="notice" role="status">Loading conversations…</p><div id="list"></div><button id="more" type="button" hidden>Load more</button></main>
<footer><a href="index.html">Home</a><a class="active" href="messages.html" aria-current="page">Messages</a><a href="me.html">Me</a></footer>
<script>
const sb=window.supabase.createClient('https://zhhgiwqehwuwzxnqbnth.supabase.co','sb_publishable_sPMtACRDzijX9yeeQ_wUUw_QGuOeryJ');
const status=document.getElementById('status'),list=document.getElementById('list'),more=document.getElementById('more'),refresh=document.getElementById('refresh');
let userId=null,pages=1,busy=false,disposed=false,channel=null,poll=null,debounce=null,hasMore=false,authSubscription=null;
async function load(extra=false){
  if(disposed||busy||!userId)return;busy=true;refresh.disabled=true;more.disabled=true;
  const requested=pages+(extra?1:0),rows=[],seen=new Set();
  try{
    let last=[];
    for(let page=0;page<requested;page++){
      last=await MimoMessages.inbox(sb,page*MimoMessages.PAGE_SIZE);
      if(disposed)return;
      for(const row of last){if(!seen.has(row.conversation_id)){seen.add(row.conversation_id);rows.push(row);}}
      if(last.length<MimoMessages.PAGE_SIZE)break;
    }
    list.replaceChildren(MimoMessages.renderInbox(document,rows));pages=requested;hasMore=last.length===MimoMessages.PAGE_SIZE;
    more.hidden=!hasMore;status.className='notice';status.textContent=rows.length?'':'No conversations yet. Open a profile and tap Chat.';
  }catch(error){if(!disposed){status.className='notice error';status.textContent='Unable to load messages. Tap Refresh to retry.';}}
  finally{busy=false;if(!disposed){refresh.disabled=false;more.disabled=false;}}
}
function schedule(){if(disposed||document.visibilityState==='hidden')return;clearTimeout(debounce);debounce=setTimeout(()=>load(),400);}
function cleanup(){disposed=true;userId=null;clearInterval(poll);clearTimeout(debounce);if(channel)sb.removeChannel(channel);if(authSubscription)authSubscription.unsubscribe();}
async function init(){
  try{
    authSubscription=sb.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'||(userId&&session&&session.user.id!==userId)){cleanup();list.replaceChildren();more.hidden=true;refresh.disabled=true;status.textContent='Your session changed. Reload or sign in again.';}}).data.subscription;
    const {data,error}=await sb.auth.getUser();if(error)throw error;
    if(disposed)return;
    if(!data.user){status.textContent='Sign in to see your conversations.';const link=document.createElement('a');link.href='login.html';link.textContent=' Sign in';status.append(link);refresh.disabled=true;return;}
    userId=data.user.id;await load();
    if(disposed)return;
    channel=sb.channel('mimo-inbox-'+userId).on('postgres_changes',{event:'*',schema:'public',table:'messages'},schedule).on('postgres_changes',{event:'INSERT',schema:'public',table:'conversations'},schedule).subscribe();
    poll=setInterval(schedule,15000);
  }catch(error){status.textContent='Unable to check your login. Reload to retry.';}
}
refresh.onclick=()=>load();more.onclick=()=>load(true);document.addEventListener('visibilitychange',schedule);window.addEventListener('pagehide',cleanup);window.addEventListener('pageshow',event=>{if(event.persisted)location.reload();});init();
</script></body></html>
