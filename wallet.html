<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Mimo — Wallet</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./wallet.js?v=20261010-wallet1"></script>
<style>*{box-sizing:border-box}body{margin:0;background:#f7f7f9;color:#222;font-family:Arial,sans-serif}header{display:flex;align-items:center;gap:16px;padding:18px;background:#fff;position:sticky;top:0;border-bottom:1px solid #eee}h1{font-size:22px;flex:1;margin:0}h2{font-size:17px}a{color:#d83e68;text-decoration:none}button{font:inherit;border:0;border-radius:18px;padding:12px;background:#fff0f5;color:#b72f53;cursor:pointer}button:disabled{opacity:.5}main{max-width:720px;margin:auto;padding:14px 14px calc(35px + env(safe-area-inset-bottom))}.balance{padding:22px;border-radius:18px;background:#fff0f5}.balance strong{font-size:30px;display:block;margin-top:12px;overflow-wrap:anywhere}.transaction{padding:16px;background:#fff;margin:12px 0;border-radius:16px}p{line-height:1.5;overflow-wrap:anywhere}.note,time,#status{color:#777;font-size:13px}#more[hidden]{display:none}</style></head><body>
<header><a href="me.html">‹</a><h1>Wallet</h1><button id="refresh">Refresh</button></header><main>
<div class="balance">💎 Your diamonds<strong id="balance">Loading…</strong></div><p class="note">Balance and transaction history only. Recharge, gift spending and withdrawals are not enabled yet.</p><h2>Transactions</h2><p id="status" role="status">Loading history…</p><div id="list"></div><button id="more" hidden>Load more</button></main>
<script>
const sb=window.supabase.createClient('https://zhhgiwqehwuwzxnqbnth.supabase.co','sb_publishable_sPMtACRDzijX9yeeQ_wUUw_QGuOeryJ'),balance=document.getElementById('balance'),list=document.getElementById('list'),status=document.getElementById('status'),refresh=document.getElementById('refresh'),more=document.getElementById('more');
let uid=null,pages=1,busy=false,disposed=false,subscription=null;
async function load(extra=false){if(disposed||busy||!uid)return;busy=true;refresh.disabled=true;more.disabled=true;balance.textContent='Loading…';const requested=pages+(extra?1:0),rows=[],seen=new Set();try{
 const amount=await MimoWallet.balance(sb);if(disposed)return;let batch=[];for(let page=0;page<requested;page++){batch=await MimoWallet.history(sb,page*30);if(disposed)return;for(const row of batch)if(!seen.has(row.id)){seen.add(row.id);rows.push(row);}if(batch.length<30)break;}
 const fragment=MimoWallet.render(document,rows);balance.textContent=MimoWallet.format(amount);list.replaceChildren(fragment);pages=requested;more.hidden=batch.length<30;status.textContent=rows.length?'':'No transactions yet.';
 }catch(error){if(!disposed){balance.textContent='Unavailable';status.textContent='Unable to load wallet. Tap Refresh to retry.';}}
 finally{busy=false;if(!disposed){refresh.disabled=false;more.disabled=false;}}}
function cleanup(){disposed=true;uid=null;subscription?.unsubscribe();list.replaceChildren();balance.textContent='Unavailable';more.hidden=true;refresh.disabled=true;}
async function init(){try{subscription=sb.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'||(uid&&session&&session.user.id!==uid)){cleanup();status.textContent='Session changed. Reload or sign in again.';}}).data.subscription;
 const {data,error}=await sb.auth.getUser();if(error)throw error;if(disposed)return;if(!data.user){balance.textContent='Sign in';status.textContent='Sign in to see your wallet. ';const link=document.createElement('a');link.href='login.html';link.textContent='Sign in';status.append(link);refresh.disabled=true;return;}uid=data.user.id;await load();
 }catch(error){if(!disposed){balance.textContent='Unavailable';status.textContent='Unable to check login. Reload to retry.';refresh.disabled=true;}}}
refresh.onclick=()=>load();more.onclick=()=>load(true);window.addEventListener('pagehide',cleanup);window.addEventListener('pageshow',e=>{if(e.persisted)location.reload();});document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='hidden')load();});init();
</script></body></html>
