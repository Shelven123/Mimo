```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mimo - Host Profile</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f7f9;
      color: #222;
      padding-bottom: 30px;
    }

    .topbar {
      height: 60px;

      align-items: center;
      padding: 0 16px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .back {
      border: none;
      background: none;
      font-size: 25px;
      cursor: pointer;
      padding: 5px 10px 5px 0;
    }

    .logo {
      color: #ff4f81;
      font-size: 21px;
      font-weight: bold;
    }

    .container {
      max-width: 850px;
      margin: auto;
      padding: 20px 15px;
    }

    .profile-card {
      background: white;

    .profile-top {
      text-align: center;
      padding: 28px 20px 22px;
    }

    .avatar {
      width: 125px;

      border-radius: 50%;
      object-fit: cover;

      margin-bottom: 12px;
    }

      font-size: 25px;

    }

    .status {
      font-size: 13px;
      margin-bottom: 16px;

      border-radius: 12px;
      font-weight: bold;

      font-size: 14px;
    }

      background: #ff4f81;

<body>

<div class="topbar">
  <button class="back" onclick="goBack()">‹</button>
  <div class="logo">❤️ Mimo</div>
</div>

<div class="container">

  <div id="profileArea">
    <div class="loading">
      Loading profile...
    </div>
  </div>

</div>

<script>

const SUPABASE_URL =
  "https://zhhgiwqehwuwzxnqbnth.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_sPMtACRDzijX9yeeQ_wUUw_QGuOeryJ";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

const params =
  new URLSearchParams(window.location.search);

const hostId =
  params.get("id");

async function loadProfile() {

  const area =
    document.getElementById("profileArea");

  if (!hostId) {

    area.innerHTML = `
      <div class="error">
        Host profile not found.
      </div>
    `;

    return;
  }

  const { data, error } =
    await supabaseClient
      .from("profiles")
      .select(`
        id,
        username,
        display_name,
        avatar_url,
        bio,
        role,
        birthday,
        region,
        education,
        occupation,
        mbti,
        zodiac,
        personality,
        appearance,
        social_purpose,
        topics,
        interests,
        online_status
      `)
      .eq("id", hostId)
      .eq("role", "host")
      .maybeSingle();

  if (error) {

    console.error(error);

    area.innerHTML = `
      <div class="error">
        Unable to load this profile.
      </div>
    `;

    return;
  }

  if (!data) {

    area.innerHTML = `
      <div class="error">
        Host not found.
      </div>
    `;

    return;
  }

  renderProfile(data);
}

function renderProfile(host) {

  const area =
    document.getElementById("profileArea");

  const name =
    host.display_name ||
    host.username ||
    "Host";

  const avatar =
    host.avatar_url ||
    "https://i.pravatar.cc/500";

  const bio =
    host.bio ||
    "Nice to meet you ❤️";

  const status =
    host.online_status === "online";

  const topics =
    Array.isArray(host.topics)
      ? host.topics
      : [];

  const interests =
    Array.isArray(host.interests)
      ? host.interests
      : [];

  area.innerHTML = `

    <div class="profile-card">

      <div class="profile-top">

        <img
          class="avatar"
          src="${avatar}"
          alt="${name}"
        >

        <div class="name">
          ${name}
        </div>

        <div class="username">
          @${host.username || "host"}
        </div>

        <div class="status ${status ? "online" : "offline"}">
          ${status ? "🟢 Online" : "⚪ Offline"}
        </div>

        <div class="bio">
          ${bio}
        </div>

        <div class="actions">

          <button
            class="primary"
            onclick="chatHost()"
          >
            💬 Chat
          </button>

          <button
            class="secondary"
            onclick="followHost()"
          >
            ❤️ Follow
          </button>

          <button
            class="secondary"
            onclick="callHost()"
          >
            📞 Call
          </button>

          <button
            class="secondary"
            onclick="makeAppointment()"
          >
            📅 Meet
          </button>

        </div>

      </div>

      <div class="info-section">

        <div class="section-title">
          About ${name}
        </div>

        <div class="info-grid">

          ${infoItem("Birthday", host.birthday)}
          ${infoItem("Region", host.region)}
          ${infoItem("Education", host.education)}
          ${infoItem("Occupation", host.occupation)}
          ${infoItem("MBTI", host.mbti)}
          ${infoItem("Zodiac", host.zodiac)}
          ${infoItem("Personality", host.personality)}
          ${infoItem("Appearance", host.appearance)}
          ${infoItem("Social Purpose", host.social_purpose)}

        </div>

      </div>

      <div class="info-section">

        <div class="section-title">
          Topics
        </div>

        <div class="tag-list">
          ${
            topics.length
              ? topics.map(item => `
                  <span class="tag">
                    ${item}
                  </span>
                `).join("")
              : `<span class="label">No topics added yet.</span>`
          }
        </div>

      </div>

      <div class="info-section">

        <div class="section-title">
          Interests
        </div>

        <div class="tag-list">
          ${
            interests.length
              ? interests.map(item => `
                  <span class="tag">
                    ${item}
                  </span>
                `).join("")
              : `<span class="label">No interests added yet.</span>`
          }
        </div>

      </div>

      <div class="info-section">

        <div class="section-title">
          More
        </div>

        <div class="actions">

          <button
            class="secondary"
            onclick="sendGift()"
          >
            🎁 Gift
          </button>

          <button
            class="secondary"
            onclick="videoCall()"
          >
            🎥 Video
          </button>

          <button
            class="secondary"
            onclick="viewImpressions()"
          >
            💬 Impressions
          </button>

        </div>

      </div>

    </div>
  `;
}

function infoItem(label, value) {

  return `
    <div class="info-item">

      <div class="label">
        ${label}
      </div>

      <div class="value">
        ${value || "Not provided"}
      </div>

    </div>
  `;
}

function chatHost() {

  window.location.href =
    "chat.html?host=" +
    encodeURIComponent(hostId);
}

function followHost() {

  alert("Follow system will be connected next.");
}

function callHost() {

  alert("Voice call will be connected next.");
}

function videoCall() {

  alert("Video call will be connected next.");
}

function makeAppointment() {

  alert("Appointment system will be connected next.");
}

function sendGift() {

  alert("Gift system will be connected next.");
}

function viewImpressions() {

  alert("Impressions will be connected next.");
}

function goBack() {

  window.history.back();
}

loadProfile();

</script>

</body>
</html>
