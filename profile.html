<body>

<div class="topbar">
  <button class="back" onclick="goBack()">‹</button>
  <div class="logo">❤️ Mimo</div>
</div>

<div class="container">

  <div id="profileArea">
    <div class="loading">
      Loading profile...
    </div>
  </div>

</div>

<script>

const SUPABASE_URL =
  "https://zhhgiwqehwuwzxnqbnth.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_sPMtACRDzijX9yeeQ_wUUw_QGuOeryJ";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

const params =
  new URLSearchParams(window.location.search);

const hostId =
  params.get("id");

let currentUser = null;
let isFollowing = false;
let followButton = null;


/* =========================
   LOAD PROFILE
========================= */

async function loadProfile() {

  const area =
    document.getElementById("profileArea");

  if (!hostId) {

    area.innerHTML = `
      <div class="error">
        Host profile not found.
      </div>
    `;

    return;
  }


  /*
    Get current logged-in user
  */

  const {
    data: {
      user
    },
    error: authError
  } =
    await supabaseClient.auth.getUser();


  if (authError) {

    console.error(
      "Auth error:",
      authError
    );

  }


  currentUser =
    user || null;


  /*
    Load host profile
  */

  const { data, error } =
    await supabaseClient
      .from("profiles")
      .select(`
        id,
        username,
        display_name,
        avatar_url,
        bio,
        role,
        birthday,
        region,
        education,
        occupation,
        mbti,
        zodiac,
        personality,
        appearance,
        social_purpose,
        topics,
        interests,
        online_status
      `)
      .eq("id", hostId)
      .eq("role", "host")
      .maybeSingle();


  if (error) {

    console.error(
      "Profile error:",
      error
    );

    area.innerHTML = `
      <div class="error">
        Unable to load this profile.
      </div>
    `;

    return;
  }


  if (!data) {

    area.innerHTML = `
      <div class="error">
        Host not found.
      </div>
    `;

    return;
  }


  renderProfile(data);


  /*
    Check Follow status
  */

  await checkFollowStatus();

}


/* =========================
   RENDER PROFILE
========================= */

function renderProfile(host) {

  const area =
    document.getElementById("profileArea");

  const name =
    host.display_name ||
    host.username ||
    "Host";

  const avatar =
    host.avatar_url ||
    "https://i.pravatar.cc/500";

  const bio =
    host.bio ||
    "Nice to meet you ❤️";

  const status =
    host.online_status === "online";

  const topics =
    Array.isArray(host.topics)
      ? host.topics
      : [];

  const interests =
    Array.isArray(host.interests)
      ? host.interests
      : [];


  area.innerHTML = `

    <div class="profile-card">

      <div class="profile-top">

        <img
          class="avatar"
          src="${escapeHtml(avatar)}"
          alt="${escapeHtml(name)}"
        >

        <div class="name">
          ${escapeHtml(name)}
        </div>

        <div class="username">
          @${escapeHtml(host.username || "host")}
        </div>

        <div class="status ${status ? "online" : "offline"}">
          ${status ? "🟢 Online" : "⚪ Offline"}
        </div>

        <div class="bio">
          ${escapeHtml(bio)}
        </div>

        <div class="actions">

          <button
            class="primary"
            onclick="chatHost()"
          >
            💬 Chat
          </button>

          <button
            id="followButton"
            class="secondary"
            onclick="followHost()"
          >
            ❤️ Follow
          </button>

          <button
            class="secondary"
            onclick="callHost()"
          >
            📞 Call
          </button>

          <button
            class="secondary"
            onclick="makeAppointment()"
          >
            📅 Meet
          </button>

        </div>

      </div>


      <div class="info-section">

        <div class="section-title">
          About ${escapeHtml(name)}
        </div>

        <div class="info-grid">

          ${infoItem("Birthday", host.birthday)}
          ${infoItem("Region", host.region)}
          ${infoItem("Education", host.education)}
          ${infoItem("Occupation", host.occupation)}
          ${infoItem("MBTI", host.mbti)}
          ${infoItem("Zodiac", host.zodiac)}
          ${infoItem("Personality", host.personality)}
          ${infoItem("Appearance", host.appearance)}
          ${infoItem("Social Purpose", host.social_purpose)}

        </div>

      </div>


      <div class="info-section">

        <div class="section-title">
          Topics
        </div>

        <div class="tag-list">

          ${
            topics.length
              ? topics.map(item => `
                  <span class="tag">
                    ${escapeHtml(item)}
                  </span>
                `).join("")
              : `<span class="label">No topics added yet.</span>`
          }

        </div>

      </div>


      <div class="info-section">

        <div class="section-title">
          Interests
        </div>

        <div class="tag-list">

          ${
            interests.length
              ? interests.map(item => `
                  <span class="tag">
                    ${escapeHtml(item)}
                  </span>
                `).join("")
              : `<span class="label">No interests added yet.</span>`
          }

        </div>

      </div>


      <div class="info-section">

        <div class="section-title">
          More
        </div>

        <div class="actions">

          <button
            class="secondary"
            onclick="sendGift()"
          >
            🎁 Gift
          </button>

          <button
            class="secondary"
            onclick="videoCall()"
          >
            🎥 Video
          </button>

          <button
            class="secondary"
            onclick="viewImpressions()"
          >
            💬 Impressions
          </button>

        </div>

      </div>

    </div>
  `;


  followButton =
    document.getElementById(
      "followButton"
    );

}


/* =========================
   CHECK FOLLOW STATUS
========================= */

async function checkFollowStatus() {

  if (!currentUser) {

    return;
  }


  /*
    Don't allow following yourself
  */

  if (
    currentUser.id === hostId
  ) {

    if (followButton) {

      followButton.disabled =
        true;

      followButton.textContent =
        "❤️ Your Profile";

    }

    return;
  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("follows")
      .select("following_id")
      .eq(
        "follower_id",
        currentUser.id
      )
      .eq(
        "following_id",
        hostId
      )
      .limit(1);


  if (error) {

    console.error(
      "Follow status error:",
      error
    );

    return;
  }


  isFollowing =
    !!(
      data &&
      data.length > 0
    );


  updateFollowButton();

}


/* =========================
   UPDATE FOLLOW BUTTON
========================= */

function updateFollowButton() {

  if (!followButton) {

    return;
  }


  if (isFollowing) {

    followButton.className =
      "following";

    followButton.textContent =
      "❤️ Following";

  } else {

    followButton.className =
      "secondary";

    followButton.textContent =
      "❤️ Follow";

  }

}


/* =========================
   FOLLOW / UNFOLLOW
========================= */

async function followHost() {

  if (!currentUser) {

    alert(
      "Please login first."
    );

    return;
  }


  if (
    currentUser.id === hostId
  ) {

    return;
  }


  if (!followButton) {

    return;
  }


  followButton.disabled =
    true;


  /*
    UNFOLLOW
  */

  if (isFollowing) {

    const {
      error
    } =
      await supabaseClient
        .from("follows")
        .delete()
        .eq(
          "follower_id",
          currentUser.id
        )
        .eq(
          "following_id",
          hostId
        );


    if (error) {

      console.error(
        "Unfollow error:",
        error
      );

      alert(
        "Unable to unfollow."
      );

      followButton.disabled =
        false;

      return;
    }


    isFollowing =
      false;

    updateFollowButton();

    followButton.disabled =
      false;

    return;
  }


  /*
    FOLLOW
  */

  if(!await MimoContacts.allow(supabaseClient,hostId,"follow")){followButton.disabled=false;return;}

  const {
    error
  } =
    await supabaseClient
      .from("follows")
      .insert({
        follower_id:
          currentUser.id,

        following_id:
          hostId
      });


  if (error) {

    console.error(
      "Follow error:",
      error
    );

    alert(
      "Unable to follow this host."
    );

    followButton.disabled =
      false;

    return;
  }


  isFollowing =
    true;

  updateFollowButton();

  followButton.disabled =
    false;

}


/* =========================
   INFO ITEM
========================= */

function infoItem(
  label,
  value
) {

  return `
    <div class="info-item">

      <div class="label">
        ${escapeHtml(label)}
      </div>

      <div class="value">
        ${escapeHtml(
          value || "Not provided"
        )}
      </div>

    </div>
  `;

}


/* =========================
   CHAT
========================= */

function chatHost() {

  window.location.href =
    "chat.html?host=" +
    encodeURIComponent(hostId);

}


/* =========================
   OTHER FEATURES
========================= */

function callHost() {

  alert(
    "Voice call will be connected next."
  );

}


function videoCall() {

  alert(
    "Video call will be connected next."
  );

}


function makeAppointment() {

  alert(
    "Appointment system will be connected next."
  );

}


function sendGift() {

  alert(
    "Gift system will be connected next."
  );

}


function viewImpressions() {

  alert(
    "Impressions will be connected next."
  );

}


/* =========================
   HELPERS
========================= */

function escapeHtml(
  text
) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    text == null
      ? ""
      : String(text);

  return div.innerHTML;

}


function goBack() {

  window.history.back();

}


/* =========================
   START
========================= */

loadProfile();

</script>

</body>
</html>
