<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Mimo - Blocked Users</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f7f7f9}.header{height:64px;background:#fff;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid #eee}.back{width:38px;height:38px;border:0;border-radius:50%;font-size:26px}.title{font-size:20px;font-weight:700;margin-left:12px}.wrap{max-width:620px;margin:auto;padding:14px}.empty,.person{background:#fff;border-radius:16px;padding:18px;margin-bottom:10px}.person{display:flex;align-items:center;gap:12px}.avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#eee}.info{flex:1}.name{font-weight:700}.user{font-size:12px;color:#999;margin-top:3px}.unblock{border:0;background:#fff0f5;color:#ff4f81;border-radius:10px;padding:9px 12px;font-weight:700}.empty{text-align:center;color:#999;margin-top:20px}</style></head><body><div class="header"><button class="back" onclick="history.back()">‹</button><div class="title">Blocked Users</div></div><div id="list" class="wrap"></div><script>
const sb=window.supabase.createClient("https://zhhgiwqehwuwzxnqbnth.supabase.co","sb_publishable_sPMtACRDzijX9yeeQ_wUUw_QGuOeryJ");
const list=document.getElementById("list");let uid=null;
function empty(message){list.replaceChildren();const item=document.createElement("div");item.className="empty";item.textContent=message;list.append(item);}
async function load(){
  try{
    const {data:{user},error:authError}=await sb.auth.getUser();if(authError)throw authError;
    if(!user){location.replace("login.html");return;}uid=user.id;
    const {data,error}=await sb.from("blocked_users").select("blocked_id").eq("blocker_id",uid);if(error)throw error;
    if(!data?.length){empty("No blocked users.");return;}
    const ids=data.map(row=>row.blocked_id),result=await sb.from("profiles").select("id,display_name,username,avatar_url").in("id",ids);
    const profiles=new Map((result.data||[]).map(p=>[p.id,p]));list.replaceChildren();
    for(const id of ids){
      const p=profiles.get(id)||{},row=document.createElement("div"),image=document.createElement("img"),info=document.createElement("div"),name=document.createElement("div"),username=document.createElement("div"),button=document.createElement("button");
      row.className="person";image.className="avatar";image.alt="";if(/^https?:\/\//i.test(p.avatar_url||""))image.src=p.avatar_url;
      info.className="info";name.className="name";name.textContent=p.display_name||"Mimo member";username.className="user";username.textContent=p.username?"@"+p.username:"";
      info.append(name,username);button.className="unblock";button.textContent="Unblock";
      button.onclick=async()=>{button.disabled=true;try{const {error}=await sb.from("blocked_users").delete().eq("blocker_id",uid).eq("blocked_id",id);if(error)throw error;await load();}catch(error){alert("Unable to unblock. Please try again.");button.disabled=false;}};
      row.append(image,info,button);list.append(row);
    }
  }catch(error){empty("Unable to load blocked users. Please try again.");}
}
load();
</script></body></html>
