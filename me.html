<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f7f7f9;
  color: #222;
  padding-bottom: 80px;
}


/* =========================
   HEADER
========================= */

.header {
  background: white;
  padding: 18px 18px 14px;
  border-bottom: 1px solid #eee;
}

.header-title {
  font-size: 22px;
  font-weight: bold;
}


/* =========================
   PROFILE
========================= */

.profile-card {
  background: white;
  margin: 14px;
  border-radius: 18px;
  padding: 20px;
  display: flex;
  align-items: center;
  gap: 15px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.05);
}

.avatar {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  object-fit: cover;
  background: #eee;
}

.profile-info {
  flex: 1;
}

.name {
  font-size: 19px;
  font-weight: bold;
}

.username {
  color: #999;
  font-size: 13px;
  margin-top: 4px;
}

.edit-btn {
  border: none;
  background: #fff0f5;
  color: #ff4f81;
  padding: 8px 12px;
  border-radius: 10px;
  cursor: pointer;
}


/* =========================
   WALLET
========================= */

.wallet-card {
  background: linear-gradient(
    135deg,
    #ff4f81,
    #ff7fa3
  );

  color: white;

  margin: 14px;

  border-radius: 18px;

  padding: 20px;
}

.wallet-title {
  font-size: 13px;
  opacity: 0.9;
}

.diamond {
  font-size: 30px;
  font-weight: bold;
  margin: 6px 0 15px;
}

.wallet-buttons {
  display: flex;
  gap: 10px;
}

.wallet-btn {
  flex: 1;
  border: none;
  border-radius: 10px;
  padding: 10px;
  cursor: pointer;
  background: white;
  color: #ff4f81;
  font-weight: bold;
}


/* =========================
   VIP
========================= */

.vip-card {
  background: white;
  margin: 14px;
  border-radius: 18px;
  padding: 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 3px 12px rgba(0,0,0,0.05);
}

.vip-title {
  font-weight: bold;
}

.vip-level {
  color: #ff4f81;
  font-size: 14px;
  margin-top: 4px;
}

.vip-btn {
  border: none;
  background: #ff4f81;
  color: white;
  padding: 9px 13px;
  border-radius: 10px;
  cursor: pointer;
}


/* =========================
   MENU
========================= */

.menu {
  background: white;
  margin: 14px;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 3px 12px rgba(0,0,0,0.04);
}

.menu-item {
  display: flex;
  align-items: center;
  padding: 17px;
  border-bottom: 1px solid #f1f1f1;
  cursor: pointer;
}

.menu-item:last-child {
  border-bottom: none;
}

.menu-icon {
  width: 34px;
  font-size: 20px;
}

.menu-text {
  flex: 1;
  font-size: 15px;
}

.arrow {
  color: #aaa;
}


/* =========================
   LOGOUT
========================= */

.logout {
  margin: 14px;
}

.logout button {
  width: 100%;
  border: none;
  background: white;
  color: #e33;
  padding: 15px;
  border-radius: 14px;
  font-size: 15px;
  cursor: pointer;
}


/* =========================
   BOTTOM NAV
========================= */

.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 68px;
  background: white;
  border-top: 1px solid #eee;
  display: flex;
  z-index: 20;
}

.nav-item {
  flex: 1;
  text-align: center;
  padding-top: 10px;
  font-size: 12px;
  color: #888;
  cursor: pointer;
}

.nav-icon {
  font-size: 21px;
  margin-bottom: 3px;
}

.nav-item.active {
  color: #ff4f81;
  font-weight: bold;
}


/* =========================
   LOADING
========================= */

.loading {
  text-align: center;
  padding: 80px 20px;
  color: #999;
}

</style>

<script>


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://zhhgiwqehwuwzxnqbnth.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_sPMtACRDzijX9yeeQ_wUUw_QGuOeryJ";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================
   INIT
========================= */

async function init() {


  const {
    data: { user }
  } = await supabaseClient
    .auth
    .getUser();


  if (!user) {

    window.location.href =
      "login.html";

    return;

  }


  await loadProfile(user.id);

  await loadWallet(user.id);

  await loadVIP(user.id);


  document.getElementById(
    "loading"
  ).style.display = "none";


  document.getElementById(
    "content"
  ).style.display = "block";

}


/* =========================
   PROFILE
========================= */

async function loadProfile(userId) {


  const {
    data,
    error
  } = await supabaseClient
    .from("profiles")
    .select(`
      id,
      username,
      display_name,
      avatar_url
    `)
    .eq("id", userId)
    .maybeSingle();


  if (error) {

    console.error(error);

    return;

  }


  if (!data) {

    return;

  }


  document.getElementById(
    "displayName"
  ).textContent =
    data.display_name ||
    "Mimo User";


  document.getElementById(
    "username"
  ).textContent =
    data.username
      ? "@" + data.username
      : "";


  if (data.avatar_url) {

    document.getElementById(
      "avatar"
    ).src = data.avatar_url;

  }

}


/* =========================
   WALLET
========================= */

let walletEpoch=0,walletOwner=null;
async function loadWallet(userId) {
 walletOwner=userId;const epoch=++walletEpoch,element=document.getElementById('diamond');element.textContent='Loading…';
 try{const value=await MimoWallet.balance(supabaseClient);const{data,error}=await supabaseClient.auth.getUser();if(epoch!==walletEpoch)return;if(error||data.user?.id!==userId)throw Error('Session changed');element.textContent=MimoWallet.format(value);}catch(error){if(epoch===walletEpoch)element.textContent='Unavailable';}
}
const walletAuthSubscription=supabaseClient.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'||(walletOwner&&session&&session.user.id!==walletOwner)){walletEpoch++;walletOwner=null;document.getElementById('diamond').textContent='Unavailable';}}).data.subscription;
window.addEventListener('pagehide',()=>{walletEpoch++;walletAuthSubscription.unsubscribe();});
window.addEventListener('pageshow',event=>{if(event.persisted)location.reload();});

/* =========================
   VIP
========================= */

async function loadVIP(userId) {


  const {
    data,
    error
  } = await supabaseClient
    .from("user_vip")
    .select(`
      level
    `)
    .eq("user_id", userId)
    .maybeSingle();


  if (error) {

    console.error(error);

    return;

  }


  if (data) {

    document.getElementById(
      "vipLevel"
    ).textContent =
      "VIP " + (data.level || 0);

  }

}


/* =========================
   ACTIONS
========================= */

function editProfile() {

  alert(
    "Profile editing will be connected next."
  );

}


function recharge() {

  location.href = "recharge.html";

}


function openWallet() {

  location.href = "wallet.html";

}


function openVIP() {

  alert(
    "VIP will be connected next."
  );

}


function openFollowing() {

  alert(
    "Following will be connected next."
  );

}


function openAppointments() {

  location.href = "appointments.html";

}


function openBackpack() {

  alert(
    "Backpack will be connected next."
  );

}


function openShop() {

  alert(
    "Shop will be connected next."
  );

}


function openSettings() {

  window.location.href =
    "settings.html";

}


/* =========================
   LOGOUT
========================= */

async function logout() {
  try{await Promise.race([window.MimoPush?.disable(supabaseClient),new Promise((_,reject)=>setTimeout(()=>reject(Error('Push cleanup timeout')),5000))]);}catch{}


  await supabaseClient
    .auth
    .signOut();


  window.location.href =
    "login.html";

}


/* =========================
   NAVIGATION
========================= */

function goHome() {

  window.location.href =
    "index.html";

}


function goPlaza() {

  window.location.href =
    "plaza.html";

}


function goMessages() {

  window.location.href =
    "messages.html";

}


function goNotifications() {

  window.location.href =
    "notifications.html";

}


/* =========================
   START
========================= */

init();

</script>
