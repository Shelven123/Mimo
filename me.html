<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f7f7f9;
  color: #222;
  padding-bottom: 80px;
}


/* =========================
   HEADER
========================= */

.header {
  background: white;
  padding: 18px 18px 14px;
  border-bottom: 1px solid #eee;
}

.header-title {
  font-size: 22px;
  font-weight: bold;
}


/* =========================
   PROFILE
========================= */

.profile-card {
  background: white;
  margin: 14px;
  border-radius: 18px;
  padding: 20px;
  display: flex;
  align-items: center;
  gap: 15px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.05);
}

.avatar {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  object-fit: cover;
  background: #eee;
}

.profile-info {
  flex: 1;
}

.name {
  font-size: 19px;
  font-weight: bold;
}

.username {
  color: #999;
  font-size: 13px;
  margin-top: 4px;
}

.edit-btn {
  border: none;
  background: #fff0f5;
  color: #ff4f81;
  padding: 8px 12px;
  border-radius: 10px;
  cursor: pointer;
}


/* =========================
   WALLET
========================= */

.wallet-card {
  background: linear-gradient(
    135deg,
    #ff4f81,
    #ff7fa3
  );

  color: white;

  margin: 14px;

  border-radius: 18px;

  padding: 20px;
}

.wallet-title {
  font-size: 13px;
  opacity: 0.9;
}

.diamond {
  font-size: 30px;
  font-weight: bold;
  margin: 6px 0 15px;
}

.wallet-buttons {
  display: flex;
  gap: 10px;
}

.wallet-btn {
  flex: 1;
  border: none;
  border-radius: 10px;
  padding: 10px;
  cursor: pointer;
  background: white;
  color: #ff4f81;
  font-weight: bold;
}


/* =========================
   VIP
========================= */

.vip-card {
  background: white;
  margin: 14px;
  border-radius: 18px;
  padding: 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 3px 12px rgba(0,0,0,0.05);
}

.vip-title {
  font-weight: bold;
}

.vip-level {
  color: #ff4f81;
  font-size: 14px;
  margin-top: 4px;
}

.vip-btn {
  border: none;
  background: #ff4f81;
  color: white;
  padding: 9px 13px;
  border-radius: 10px;
  cursor: pointer;
}


/* =========================
   MENU
========================= */

.menu {
  background: white;
  margin: 14px;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 3px 12px rgba(0,0,0,0.04);
}

.menu-item {
  display: flex;
  align-items: center;
  padding: 17px;
  border-bottom: 1px solid #f1f1f1;
  cursor: pointer;
}

.menu-item:last-child {
  border-bottom: none;
}

.menu-icon {
  width: 34px;
  font-size: 20px;
}

.menu-text {
  flex: 1;
  font-size: 15px;
}

.arrow {
  color: #aaa;
}


/* =========================
   LOGOUT
========================= */

.logout {
  margin: 14px;
}

.logout button {
  width: 100%;
  border: none;
  background: white;
  color: #e33;
  padding: 15px;
  border-radius: 14px;
  font-size: 15px;
  cursor: pointer;
}


/* =========================
   BOTTOM NAV
========================= */

.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 68px;
  background: white;
  border-top: 1px solid #eee;
  display: flex;
  z-index: 20;
}

.nav-item {
  flex: 1;
  text-align: center;
  padding-top: 10px;
  font-size: 12px;
  color: #888;
  cursor: pointer;
}

.nav-icon {
  font-size: 21px;
  margin-bottom: 3px;
}

.nav-item.active {
  color: #ff4f81;
  font-weight: bold;
}


/* =========================
   LOADING
========================= */

.loading {
  text-align: center;
  padding: 80px 20px;
  color: #999;
}

<script>


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://zhhgiwqehwuwzxnqbnth.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_sPMtACRDzijX9yeeQ_wUUw_QGuOeryJ";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================
   INIT
========================= */

let meAlive=true,meEpoch=0,meOwner=null,meObserved,meRefreshedAt=0,meAuthRetry=null;
function clearProfile(){
 document.getElementById('displayName').textContent='—';
 document.getElementById('username').textContent='';
 document.getElementById('avatar').src='assets/neon/avatar-placeholder.svg';
 document.getElementById('vipLevel').textContent='VIP —';
}
function profileStatus(message){
 const status=document.getElementById('loading');status.replaceChildren();status.hidden=!message;
 if(message){status.append(document.createTextNode(message+' '));const retry=document.createElement('button');retry.type='button';retry.textContent='重试';retry.onclick=()=>init();status.append(retry);}
}
async function init() {
 const ticket=++meEpoch;
 document.getElementById('content').setAttribute('aria-busy','true');profileStatus('');
 try{
  const {data,error}=await supabaseClient.auth.getUser();
  if(!meAlive||ticket!==meEpoch)return;
  if(error)throw error;
  const user=data?.user;
  if(!user){clearProfile();window.top.location.replace('login.html');return;}
  if(meObserved!==undefined&&meObserved!==user.id){profileStatus('登录状态已变化，请重试。');return;}
  meOwner=user.id;
  // Render the static page immediately; independent reads never gate one another.
  await Promise.allSettled([loadProfile(user.id,ticket),loadWallet(user.id),loadVIP(user.id,ticket)]);
 }catch{
  if(meAlive&&ticket===meEpoch)profileStatus('暂时无法更新资料，请检查网络。');
 }finally{
  if(meAlive&&ticket===meEpoch){document.getElementById('content').setAttribute('aria-busy','false');meRefreshedAt=Date.now();window.MimoPageDataReady=true;window.dispatchEvent(new Event('mimo:page-ready'));}
 }
}


/* =========================
   PROFILE
========================= */

async function loadProfile(userId,ticket=meEpoch) {


  const {
    data,
    error
  } = await supabaseClient
    .from("profiles")
    .select(`
      id,
      username,
      display_name,
      avatar_url
    `)
    .eq("id", userId)
    .maybeSingle();


  if(!meAlive||ticket!==meEpoch||meOwner!==userId)return;
  window.MimoPageDataReady=true;window.dispatchEvent(new Event('mimo:page-ready'));

  if (error) {
    profileStatus('资料暂时无法更新。');

    console.error(error);

    return;

  }


  if (!data || data.id!==userId) {
    profileStatus('暂时无法读取当前账号资料，请重试。');
    return;
  }


  document.getElementById(
    "displayName"
  ).textContent =
    data.display_name || data.username ||
    "Mimo User";


  document.getElementById(
    "username"
  ).textContent =
    data.username
      ? "@" + data.username
      : "";


  if (data.avatar_url) {

    document.getElementById(
      "avatar"
    ).src = data.avatar_url;

  }

}


/* =========================
   WALLET
========================= */

let walletEpoch=0,walletOwner=null;
async function loadWallet(userId) {
 walletOwner=userId;const epoch=++walletEpoch,element=document.getElementById('diamond');element.textContent=element.textContent.trim()||'—';
 try{const value=await MimoWallet.balance(supabaseClient);const{data,error}=await supabaseClient.auth.getUser();if(epoch!==walletEpoch)return;if(error||data.user?.id!==userId)throw Error('Session changed');element.textContent=MimoWallet.format(value);}catch(error){if(epoch===walletEpoch)element.textContent='Unavailable';}
}
const walletAuthSubscription=supabaseClient.auth.onAuthStateChange((event,session)=>{
 const next=session?.user?.id||null;
 const changed=event==='SIGNED_OUT'||(meObserved!==undefined&&next!==meObserved)||(meOwner&&next!==meOwner)||(walletOwner&&next!==walletOwner);
 meObserved=next;
 if(changed){meEpoch++;meOwner=null;walletEpoch++;walletOwner=null;clearProfile();profileStatus('');document.getElementById('diamond').textContent='Unavailable';document.getElementById('content').setAttribute('aria-busy','false');clearTimeout(meAuthRetry);if(next&&meAlive){const ticket=meEpoch;meAuthRetry=setTimeout(()=>{if(meAlive&&ticket===meEpoch)init();},0);}}
}).data.subscription;
window.addEventListener('pagehide',()=>{meAlive=false;meEpoch++;clearTimeout(meAuthRetry);clearProfile();walletEpoch++;walletAuthSubscription.unsubscribe();});
window.addEventListener('pageshow',event=>{if(event.persisted)location.reload();});

/* =========================
   VIP
========================= */

async function loadVIP(userId,ticket=meEpoch) {


  const {
    data,
    error
  } = await supabaseClient
    .from("user_vip")
    .select(`
      level
    `)
    .eq("user_id", userId)
    .maybeSingle();


  if(!meAlive||ticket!==meEpoch||meOwner!==userId)return;

  if (error) {

    console.error(error);

    return;

  }


  if (data) {

    document.getElementById(
      "vipLevel"
    ).textContent =
      "VIP " + (data.level || 0);

  }

}


/* =========================
   ACTIONS
========================= */

function editProfile() {

  alert(
    "Profile editing will be connected next."
  );

}


function recharge() {

  window.top.location.href = "recharge.html";

}


function openWallet() {

  window.top.location.href = "wallet.html";

}


function openVIP() {

  alert(
    "VIP will be connected next."
  );

}


function openFollowing() {

  alert(
    "Following will be connected next."
  );

}


function openAppointments() {

  window.top.location.href = "appointments.html";

}


function openBackpack() {

  alert(
    "Backpack will be connected next."
  );

}


function openShop() {

  alert(
    "Shop will be connected next."
  );

}


function openSettings() {

  window.top.location.href =
    "settings.html";

}


/* =========================
   LOGOUT
========================= */

async function logout() {
  try{await Promise.race([window.MimoPush?.disable(supabaseClient),new Promise((_,reject)=>setTimeout(()=>reject(Error('Push cleanup timeout')),5000))]);}catch{}


  await supabaseClient
    .auth
    .signOut();


  window.top.location.href =
    "login.html";

}


/* =========================
   NAVIGATION
========================= */

function goHome() {

  window.top.location.href =
    "index.html";

}


function goPlaza() {

  window.top.location.href =
    "plaza.html";

}


function goMessages() {

  window.top.location.href =
    "messages.html";

}


function goNotifications() {

  window.top.location.href =
    "notifications.html";

}


/* =========================
   START
========================= */

window.addEventListener('mimo:tab-visibility',()=>{if(window.MimoTabVisible!==false&&meOwner&&meRefreshedAt&&Date.now()-meRefreshedAt>15000)init();});
init();

</script>
