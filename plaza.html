croll-snap-type:x mandatory}.post-media>img{width:100%;flex:0 0 100%;height:auto;max-height:540px;object-fit:contain;scroll-snap-align:center}.icon-action{background:transparent;color:#383540;border-radius:50%;padding:6px;display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:40px;min-width:40px;touch-action:manipulation}.icon-action svg{width:24px;height:24px;flex-shrink:0}.icon-action span{font-size:12px;font-weight:600}.icon-action:hover{background:#f8f5f7}.icon-action.is-on{color:#ef4777}.icon-action.is-on svg{fill:#ffe8ef}.actions{display:flex;flex-wrap:wrap;align-items:center;gap:7px;padding:10px 14px 3px}.actions .icon-action:nth-child(5){margin-left:auto}.gift-trigger{background:#ffffffed;color:#d83e68;box-shadow:0 3px 14px #0002}.post-media .gift-trigger{position:sticky;right:12px;bottom:12px;align-self:flex-end;flex-shrink:0;margin-left:-52px;margin-bottom:12px;z-index:1}.post-date{display:block;padding:0 20px 16px;font-size:10px;text-transform:uppercase;letter-spacing:.3px}.comment{border-bottom:1px solid #eee;padding:14px 0}.comment button{margin-left:8px}.tabs{display:flex;gap:8px;margin:12px 0}.tabs button{flex:1;font-size:13px;background:#eaeaf0;color:#777}.tabs button.active{color:#d83e68;background:#ffedf3;font-weight:700}nav{position:fixed;bottom:0;left:0;right:0;background:#fffffffa;border-top:1px solid #eee;display:flex;justify-content:space-around;padding:14px 6px calc(14px + env(safe-area-inset-bottom));z-index:3;font-size:13px}nav a{color:#777}nav .active{color:#d83e68;font-weight:bold}dialog{border:0;border-radius:24px;padding:22px;width:min(460px,calc(100% - 24px));max-height:85dvh;overflow:auto;box-shadow:0 24px 100px #16112433}dialog::backdrop{background:#19152266;backdrop-filter:blur(3px)}.sheet-head{display:flex;align-items:center;gap:10px}.sheet-head h2{flex:1;margin:0}.sheet-button{width:100%;display:block;text-align:left;background:#f6f5f8;color:#3f3b48;margin:10px 0;padding:15px}.danger{color:#d54262}.primary{width:100%;background:#ed4779;color:#fff;font-weight:700;padding:14px}.share-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:15px 0}.share-target{background:#f4f3f8;text-align:center;padding:15px;border-radius:12px;font-weight:600;font-size:13px}.evidence-preview{display:flex;gap:10px}.evidence-preview img{width:75px;height:75px;object-fit:cover;border-radius:10px}.gift-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:18px}.gift-card{padding:12px 4px;background:#f7f6f9;color:#34303e;border:1px solid transparent;display:flex;flex-direction:column;align-items:center;gap:8px}.gift-card.selected{border-color:#ef4777;background:#fff0f5}.gift-card img,.gift-card svg{width:44px;height:44px;object-fit:contain}.gift-card strong{font-size:12px}.gift-card span{font-size:10px;color:#95909e}.dialog-message{font-size:13px;line-height:1.5;color:#b74365}[hidden]{display:none!important}@media(max-width:380px){.actions{gap:1px;padding-left:8px;padding-right:8px}.icon-action svg{width:22px;height:22px}.icon-action span{font-size:11px}.post-head{padding-left:14px;padding-right:14px}}
</style><script src="./contact-permissions.js"></script><script src="./plaza-social.js?v=20261010-social1"></script><script src="./plaza-social-ui.js?v=20261010-social1"></script></head><body>
<header><a href="index.html">‹</a><h1>Plaza</h1><button id="refresh">Refresh</button></header><main>
<p id="status" role="status">Loading…</p><p id="roleNote" class="note">Hosts share updates here. Sign in to browse and join the conversation.</p>
<section id="composer" hidden><h2>Share an update</h2><form id="publish"><fieldset id="postFields" disabled style="border:0;padding:0;margin:0"><label>Your update<textarea id="postBody" maxlength="2000" required placeholder="What's on your mind?"></textarea></label><p class="note">Text posts are available now. Image upload will be added later.</p><button type="submit">Publish</button></fieldset></form></section>
<div class="tabs"><button data-mode="all" class="active">Discover</button><button data-mode="saved">Saved</button><button data-mode="reposted">Reposts</button></div><button id="viewAll" hidden>View all updates</button><p id="empty" class="note" hidden>No updates yet.</p><div id="feed"></div><button id="more" hidden>Load more updates</button>
<section id="discussion" hidden><button id="closeDiscussion">Close comments</button><h2>Comments</h2><p id="selectedBody"></p><div id="comments"></div><p id="emptyComments" class="note" hidden>No comments yet.</p><button id="moreComments" hidden>Load more comments</button><form id="commentForm"><fieldset id="commentFields" disabled style="border:0;padding:0;margin:0"><label>Your comment<textarea id="commentBody" maxlength="1000" required></textarea></label><button type="submit">Post comment</button></fieldset></form></section>
</main><dialog id="socialDialog"><div class="sheet-head"><h2 id="socialTitle"></h2><button id="socialClose" aria-label="Close dialog">✕</button></div><div id="socialPanel"></div><p id="socialMessage" class="dialog-message" role="status"></p></dialog><nav><a href="index.html">🏠 Home</a><a class="active" href="plaza.html">🌐 Plaza</a><a href="messages.html">💬 Messages</a><a href="me.html">👤 Me</a></nav>
<script>
const sb=window.supabase.createClient('https://zhhgiwqehwuwzxnqbnth.supabase.co','sb_publishable_sPMtACRDzijX9yeeQ_wUUw_QGuOeryJ'),el=id=>document.getElementById(id);
window.mimoPlazaClient=sb;
let mode="all",focused=new URLSearchParams(location.search).get("post"),uid=null,role=null,busy=false,disposed=false,pages=1,commentPages=1,selected=null,subscription=null,timer=null,postAttempt=null,commentAttempt=null;
function controls(){el('postFields').disabled=busy||disposed||role!=='host';el('commentFields').disabled=busy||disposed||!uid||!selected;el('refresh').disabled=busy||disposed||!uid;el('more').disabled=busy;el('moreComments').disabled=busy;for(const button of document.querySelectorAll('.actions button,.comment button,.post-head button,.tabs button'))button.disabled=busy;socialUI?.controls(busy);}
function cleanup(){socialUI?.dispose();disposed=true;uid=role=selected=null;postAttempt=commentAttempt=null;clearInterval(timer);subscription?.unsubscribe();el('feed').replaceChildren();el('comments').replaceChildren();el('selectedBody').textContent='';el('discussion').hidden=true;el('composer').hidden=true;el('more').hidden=true;el('publish').reset();el('commentForm').reset();controls();}
async function loadComments(){if(!selected)return;const id=selected.id;const {data,error}=await sb.from('posts').select('id,content').eq('id',id).maybeSingle();if(disposed)return;if(error||!data)throw Error('Post unavailable');const rows=[],seen=new Set();let batch=[];for(let page=0;page<commentPages;page++){batch=await MimoPlaza.comments(sb,id,page*30);if(disposed||selected?.id!==id)return;for(const row of batch)if(!seen.has(row.id)){seen.add(row.id);rows.push(row);}if(batch.length<30)break;}el('selectedBody').textContent=data.content||'';el('comments').replaceChildren(MimoPlaza.renderComments(document,rows,uid,removeComment));el('emptyComments').hidden=rows.length>0;el('moreComments').hidden=batch.length<30;el('discussion').hidden=false;}
async function load(extra=false){if(busy||disposed||!uid)return;busy=true;controls();el('status').textContent='Loading…';try{const requested=pages+(extra?1:0),rows=[],seen=new Set();let batch=[];for(let page=0;page<requested;page++){batch=await MimoPlaza.feed(sb,page*20,mode,focused);if(disposed)return;for(const row of batch)if(!seen.has(row.id)){seen.add(row.id);rows.push(row);}if(batch.length<20)break;}el('feed').replaceChildren(MimoPlaza.renderFeed(document,rows,uid,{like:likePost,comments:choose,remove:removePost,menu:socialUI?.menu,share:socialUI?.share,gift:socialUI?.gift,save:row=>mutate(()=>MimoPlazaSocial.mark(sb,row,"bookmark")),repost:row=>mutate(()=>MimoPlazaSocial.mark(sb,row,"repost"))}));el('empty').hidden=rows.length>0;el('empty').textContent=focused?'This post is unavailable or hidden.':mode==='saved'?'No saved updates yet.':mode==='reposted'?'No reposts yet.':'No updates yet.';el('viewAll').hidden=!focused;el('more').hidden=batch.length<20;pages=requested;await loadComments();if(!disposed)el('status').textContent='';}catch(error){if(!disposed){selected=null;el('comments').replaceChildren();el('selectedBody').textContent='';el('discussion').hidden=true;el('status').textContent='Unable to load updates or comments. Tap Refresh to retry.';}}finally{busy=false;if(!disposed)controls();}}
async function mutate(action,success){if(busy||disposed||!uid)return false;busy=true;controls();let saved=false;try{await action();if(disposed)return false;success?.();saved=true;el('status').textContent='Saved.';}catch(error){if(!disposed)el('status').textContent='Unable to save. The post may have changed or contact may be blocked. Refresh or retry; your draft is retained.';}finally{busy=false;if(!disposed)controls();}if(saved)await load();return saved;}
function choose(row){if(busy||disposed)return;selected=row;commentPages=1;commentAttempt=null;el('commentForm').reset();load().then(()=>{if(!disposed&&!el('discussion').hidden)el('discussion').scrollIntoView?.({behavior:'smooth',block:'start'});});}
function attempt(previous,values){const key=JSON.stringify(values);return previous?.key===key?previous:{key,id:crypto.randomUUID()};}
el('publish').onsubmit=async event=>{event.preventDefault();if(busy||disposed||role!=='host')return;const body=el('postBody').value;try{MimoPlaza.clean(body,2000);postAttempt=attempt(postAttempt,[body]);}catch(error){el('status').textContent=error.message;return;}await mutate(()=>MimoPlaza.publish(sb,postAttempt.id,body),()=>{postAttempt=null;el('publish').reset();pages=1;});};
el('commentForm').onsubmit=async event=>{event.preventDefault();if(busy||disposed||!selected)return;const id=selected.id,body=el('commentBody').value;try{MimoPlaza.clean(body,1000);commentAttempt=attempt(commentAttempt,[id,body]);}catch(error){el('status').textContent=error.message;return;}await mutate(()=>MimoPlaza.comment(sb,commentAttempt.id,id,body),()=>{commentAttempt=null;el('commentForm').reset();});};
async function likePost(row){await mutate(()=>MimoPlaza.like(sb,row.id,!row.liked));}
async function removePost(row){if(busy||disposed||row.author_id!==uid||!confirm('Delete this post and its comments? This cannot be undone.'))return;await mutate(()=>MimoPlaza.remove(sb,'posts',row.id,uid),()=>{if(selected?.id===row.id){selected=null;el('discussion').hidden=true;el('comments').replaceChildren();el('commentForm').reset();}});}
async function removeComment(row){if(busy||disposed||row.user_id!==uid||!confirm('Delete your comment?'))return;await mutate(()=>MimoPlaza.remove(sb,'post_comments',row.id,uid));}
el('refresh').onclick=()=>load();el('more').onclick=()=>load(true);el('moreComments').onclick=()=>{if(!busy){commentPages++;load();}};el('closeDiscussion').onclick=()=>{if(busy)return;selected=null;commentAttempt=null;el('discussion').hidden=true;el('comments').replaceChildren();el('selectedBody').textContent='';el('commentForm').reset();controls();};
async function init(){try{subscription=sb.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'||(uid&&session&&session.user.id!==uid)){cleanup();el('status').textContent='Session changed. Reload or sign in again.';}}).data.subscription;const {data,error}=await sb.auth.getUser();if(error)throw error;if(disposed)return;if(!data.user){el('status').textContent='Sign in to browse Plaza. ';const link=document.createElement('a');link.href='login.html';link.textContent='Sign in';el('status').append(link);controls();return;}uid=data.user.id;role=await MimoPlaza.role(sb);if(disposed)return;el('composer').hidden=role!=='host';el('roleNote').textContent=role==='host'?'Share updates and join the conversation.':'Only Hosts publish updates. You can like and comment.';await load();if(disposed)return;timer=setInterval(()=>{if(!document.hidden)load();},30000);}catch(error){if(!disposed){uid=role=null;controls();el('status').textContent='Unable to check profile. Reload to retry.';}}}
const socialUI=window.MimoPlazaUI?MimoPlazaUI.create({el,getUser:()=>disposed?null:uid,canAct:()=>!busy&&!disposed&&!!uid,mutate,load,removePost}):null;
if(!/^[0-9a-f-]{36}$/i.test(focused||''))focused=null;
for(const tab of document.querySelectorAll('[data-mode]'))tab.onclick=()=>{if(busy||disposed)return;mode=tab.dataset.mode;pages=1;selected=null;el('discussion').hidden=true;for(const t of document.querySelectorAll('[data-mode]'))t.classList.toggle('active',t===tab);load();};
el('viewAll').onclick=()=>{focused=null;pages=1;history.replaceState(null,'','plaza.html');load();};
window.addEventListener('pagehide',cleanup);window.addEventListener('pageshow',event=>{if(event.persisted)location.reload();});document.addEventListener('visibilitychange',()=>{if(!document.hidden)load();});init();
</script></body></html>
