<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f7f7f9;
  color: #222;
  padding-bottom: 80px;
}


/* =========================
   HEADER
========================= */

.header {
  background: white;
  padding: 18px 18px 14px;
  border-bottom: 1px solid #eee;
}

.header-title {
  font-size: 22px;
  font-weight: bold;
}


/* =========================
   PROFILE
========================= */

.profile-card {
  background: white;
  margin: 14px;
  border-radius: 18px;
  padding: 20px;
  display: flex;
  align-items: center;
  gap: 15px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.05);
}

.avatar {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  object-fit: cover;
  background: #eee;
}

.profile-info {
  flex: 1;
}

.name {
  font-size: 19px;
  font-weight: bold;
}

.username {
  color: #999;
  font-size: 13px;
  margin-top: 4px;
}

.edit-btn {
  border: none;
  background: #fff0f5;
  color: #ff4f81;
  padding: 8px 12px;
  border-radius: 10px;
  cursor: pointer;
}


/* =========================
   WALLET
========================= */

.wallet-card {
  background: linear-gradient(
    135deg,
    #ff4f81,
    #ff7fa3
  );

  color: white;

  margin: 14px;

  border-radius: 18px;

  padding: 20px;
}

.wallet-title {
  font-size: 13px;
  opacity: 0.9;
}

.diamond {
  font-size: 30px;
  font-weight: bold;
  margin: 6px 0 15px;
}

.wallet-buttons {
  display: flex;
  gap: 10px;
}

.wallet-btn {
  flex: 1;
  border: none;
  border-radius: 10px;
  padding: 10px;
  cursor: pointer;
  background: white;
  color: #ff4f81;
  font-weight: bold;
}


/* =========================
   VIP
========================= */

.vip-card {
  background: white;
  margin: 14px;
  border-radius: 18px;
  padding: 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 3px 12px rgba(0,0,0,0.05);
}

.vip-title {
  font-weight: bold;
}

.vip-level {
  color: #ff4f81;
  font-size: 14px;
  margin-top: 4px;
}

.vip-btn {
  border: none;
  background: #ff4f81;
  color: white;
  padding: 9px 13px;
  border-radius: 10px;
  cursor: pointer;
}


/* =========================
   MENU
========================= */

.menu {
  background: white;
  margin: 14px;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 3px 12px rgba(0,0,0,0.04);
}

.menu-item {
  display: flex;
  align-items: center;
  padding: 17px;
  border-bottom: 1px solid #f1f1f1;
  cursor: pointer;
}

.menu-item:last-child {
  border-bottom: none;
}

.menu-icon {
  width: 34px;
  font-size: 20px;
}

.menu-text {
  flex: 1;
  font-size: 15px;
}

.arrow {
  color: #aaa;
}


/* =========================
   LOGOUT
========================= */

.logout {
  margin: 14px;
}

.logout button {
  width: 100%;
  border: none;
  background: white;
  color: #e33;
  padding: 15px;
  border-radius: 14px;
  font-size: 15px;
  cursor: pointer;
}


/* =========================
   BOTTOM NAV
========================= */

.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 68px;
  background: white;
  border-top: 1px solid #eee;
  display: flex;
  z-index: 20;
}

.nav-item {
  flex: 1;
  text-align: center;
  padding-top: 10px;
  font-size: 12px;
  color: #888;
  cursor: pointer;
}

.nav-icon {
  font-size: 21px;
  margin-bottom: 3px;
}

.nav-item.active {
  color: #ff4f81;
  font-weight: bold;
}


/* =========================
   LOADING
========================= */

.loading {
  text-align: center;
  padding: 80px 20px;
  color: #999;
}

</style>
